<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Doodle Studio</title>
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doodle">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#FFF6E9;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:#2B2340;user-select:none;-webkit-user-select:none}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px}
header h1{margin:0 auto 0 4px;font-size:clamp(17px,5vw,22px);white-space:nowrap;font-weight:900;letter-spacing:-.02em}
header h1 span{color:#FF5E5B}
.btn{white-space:nowrap;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:14px;padding:10px 14px;background:#fff;color:#2B2340;box-shadow:0 2px 0 rgba(43,35,64,.15);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.hub{text-decoration:none;padding:9px 12px;font-size:15px}
@media (max-width:480px){.btn.hub span,#undo span,#post span{display:none}header{gap:6px;padding:10px 8px}header .btn{padding:9px 11px}header h1{font-size:17px}}
.btn.post{background:#FF6FB5;color:#fff}
.modal{position:fixed;inset:0;z-index:20;background:rgba(43,35,64,.45);display:grid;place-items:center;padding:16px}
.modal.hidden{display:none}
.sheet{background:#FFF6E9;border-radius:24px;padding:20px;width:min(420px,100%);display:grid;gap:12px;box-shadow:0 20px 50px rgba(43,35,64,.3)}
.sheet h2{margin:0;font-size:24px;font-weight:900}
.sheet p{margin:0;color:#6B6485}
.sheet img{width:100%;max-height:34vh;object-fit:contain;background:#fff;border-radius:14px;border:2px solid rgba(43,35,64,.1)}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:9px 16px;background:#fff;color:#2B2340;box-shadow:0 2px 0 rgba(43,35,64,.12)}
.who button.on{background:#FFB627}
.sheet input{font:inherit;font-weight:700;font-size:17px;border:2px solid rgba(43,35,64,.15);border-radius:12px;padding:10px 12px;background:#fff}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}
.sheet a.btn{text-decoration:none}
.btn.save{background:#2EC4B6;color:#fff}
.stage{position:relative;margin:0 12px;border-radius:22px;background:#fff;box-shadow:0 6px 24px rgba(43,35,64,.12);overflow:hidden;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.item{position:absolute;left:0;top:0;transform-origin:center;white-space:pre;line-height:1;cursor:grab;touch-action:none;font-weight:900}
.item.bub{background:#fff;border:3px solid #2B2340;border-radius:999px;padding:.55em .9em;font-weight:800;max-width:none}
.item.say::before,.item.say::after,.item.think::before,.item.think::after{content:"";position:absolute;left:22%;border-style:solid}
.item.say::before{bottom:-17px;border-width:16px 6px 0 10px;border-color:#2B2340 transparent transparent transparent}
.item.say::after{bottom:-11px;left:calc(22% + 3px);border-width:10px 3px 0 6px;border-color:#fff transparent transparent transparent}
.item.think{border-radius:50%/60%}
.item.think::before{bottom:-16px;width:12px;height:12px;border:3px solid #2B2340;border-radius:50%;background:#fff}
.item.think::after{bottom:-28px;left:calc(22% - 10px);width:7px;height:7px;border:3px solid #2B2340;border-radius:50%;background:#fff}
.item.shout{border-radius:6px;background:#FFE14D;transform-origin:center;font-weight:900;text-transform:uppercase;box-shadow:4px 4px 0 #2B2340}
.lay{width:40px;height:48px;border-radius:12px}
.item.sel{outline:3px dashed #2EC4B6;outline-offset:6px;border-radius:8px}
.itemctl{position:absolute;display:none;gap:6px;z-index:5}
.itemctl.on{display:flex}
.itemctl button{font:inherit;font-size:18px;font-weight:900;width:40px;height:40px;border:0;border-radius:12px;background:#2B2340;color:#fff}
.textin{position:absolute;z-index:6;font:inherit;font-weight:900;border:3px solid #2EC4B6;border-radius:10px;padding:4px 8px;background:#fff;min-width:160px;outline:none}
footer{padding:10px 12px 12px;display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tool{flex:none;font:inherit;border:0;border-radius:16px;background:#fff;padding:8px 12px;display:grid;justify-items:center;gap:2px;font-size:12px;font-weight:800;color:#6B6485;box-shadow:0 2px 0 rgba(43,35,64,.12);min-width:64px}
.tool b{font-size:26px;line-height:1}
.tool.on{background:#FFB627;color:#2B2340}
.sw{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,35,64,.15)}
.sw.on{box-shadow:0 0 0 3px #2B2340;transform:scale(1.1)}
.size{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 2px 0 rgba(43,35,64,.12)}
.size i{display:block;border-radius:50%;background:#2B2340}
.size.on{background:#FFB627}
.sep{flex:none;width:2px;height:30px;background:rgba(43,35,64,.12);border-radius:2px}
.stick{flex:none;font-size:30px;width:50px;height:50px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 0 rgba(43,35,64,.12)}
.stick.on{background:#FFB627}
.hidden{display:none}
.toast{position:fixed;left:50%;bottom:40%;transform:translateX(-50%);background:#2B2340;color:#fff;font-weight:800;padding:12px 18px;border-radius:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="btn hub" href="https://nikhilharsh.com" aria-label="Back to the family hub">🏡<span> Family hub</span></a>
    <h1>Doodle <span>Studio</span></h1>
    <button class="btn" id="undo" aria-label="Undo">↩︎<span> Undo</span></button>
    <button class="btn" id="clear">New</button>
    <button class="btn post" id="post">📌<span> Post</span></button>
    <button class="btn save" id="save">Save</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="itemctl" id="ctl"><button data-a="smaller">−</button><button data-a="bigger">+</button><button data-a="turn">⟳</button><button data-a="del">🗑</button></div>
  </div>
  <footer>
    <div class="row" id="tools"></div>
    <div class="row" id="opts"></div>
  </footer>
</div>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
const TOOLS = [['pen','✏️','Pencil'],['marker','🖍️','Marker'],['fill','🪣','Fill'],['eraser','🧽','Eraser'],['sticker','⭐','Stickers'],['text','🔤','Words'],['comic','💬','Comic'],['shape','🔷','Shapes'],['template','🖼️','Templates']];
const COLORS = ['#2B2340','#FF5E5B','#FF8A3D','#FFB627','#FFE14D','#7ED957','#2EC4B6','#3A86FF','#8E5CF7','#FF6FB5','#8B5A2B','#FFFFFF'];
const SIZES = [4,10,22];
const LAYOUTS = {
  one:  [[0,0,1,1]],
  two:  [[0,0,1,.5],[0,.5,1,.5]],
  three:[[0,0,1,.5],[0,.5,.5,.5],[.5,.5,.5,.5]],
  four: [[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]],
  six:  [[0,0,.5,1/3],[.5,0,.5,1/3],[0,1/3,.5,1/3],[.5,1/3,.5,1/3],[0,2/3,.5,1/3],[.5,2/3,.5,1/3]]
};
const STAR = (() => { let d = ''; for(let i = 0; i < 10; i++){ const r = i % 2 ? 19 : 46, a = -Math.PI/2 + i*Math.PI/5; d += (i ? 'L' : 'M') + (50 + r*Math.cos(a)).toFixed(1) + ' ' + (53 + r*Math.sin(a)).toFixed(1); } return d + 'Z'; })();
const SHAPES = {
  heart: 'M50 88C20 66 6 50 6 32C6 18 17 8 30 8C40 8 46 14 50 21C54 14 60 8 70 8C83 8 94 18 94 32C94 50 80 66 50 88Z',
  star: STAR,
  circle: 'M50 6A44 44 0 1 1 49.99 6Z',
  square: 'M10 10H90V90H10Z',
  triangle: 'M50 8L94 90H6Z',
  arrow: 'M6 38H56V16L94 50L56 84V62H6Z',
  bolt: 'M58 4L18 56H46L38 96L82 40H54Z',
  cloud: 'M28 78C14 78 6 68 6 58C6 47 15 39 26 40C28 26 39 18 52 18C66 18 76 28 78 40C88 40 94 48 94 58C94 70 86 78 74 78Z',
  moon: 'M62 6A44 44 0 1 0 94 68A36 36 0 1 1 62 6Z'
};
const TEMPLATES = [['birthday','🎂','Birthday'],['thanks','💐','Thank you'],['weekend','📅','My weekend'],['color','🏠','Coloring'],['sea','🐠','Under the sea']];
const shapeSVG = (k, fill, px) => `<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="display:block;overflow:visible"><path d="${SHAPES[k]}" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"'}/></svg>`;
const STICKERS = ['⭐','❤️','🌈','🦄','🐱','🐶','🌸','🌻','☀️','🌙','🎈','🎂','🍓','🦋','👑','💎','🐠','🚀','⚽','🎨','😀','😍','🥳','✨'];
const FAMILY = location.hostname === 'family.nikhilharsh.com';
if(FAMILY){ const h = document.querySelector('.btn.hub'); h.href = '/'; h.querySelector('span').textContent = ' Family area'; }
const store = { get(k,v){ try{ const x = localStorage.getItem(k); return x===null ? v : JSON.parse(x); }catch(e){ return v; } },
                set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } } };

const stage = document.getElementById('stage'), cv = document.getElementById('cv'), ctx = cv.getContext('2d', {willReadFrequently:true});
const ctl = document.getElementById('ctl');
let shapeName = 'heart', shapeFill = true, bubbleKind = 'say', tool = 'pen', color = COLORS[1], size = 1, sticker = STICKERS[0];
let W = 0, H = 0, DPR = 1, items = [], selected = null, history = [];

// ---------- layout ----------
function fit(){
  const r = stage.getBoundingClientRect();
  const old = W ? cv.toDataURL() : null;
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  paper();
  if(old){ const im = new Image(); im.onload = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(im, 0, 0); ctx.restore(); }; im.src = old; }
}
function paper(){ ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.restore(); }
function drawImg(src, cb){ const im = new Image(); im.onload = () => { ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(im,0,0,cv.width,cv.height); ctx.restore(); cb && cb(); }; im.src = src; }

// ---------- toolbar ----------
const toolsEl = document.getElementById('tools'), optsEl = document.getElementById('opts');
toolsEl.innerHTML = TOOLS.map(([k,e,n]) => `<button class="tool" data-t="${k}"><b>${e}</b>${n}</button>`).join('');
toolsEl.onclick = e => { const b = e.target.closest('[data-t]'); if(!b) return; tool = b.dataset.t; select(null); renderOpts(); };
function renderOpts(){
  toolsEl.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.t === tool));
  if(tool === 'comic'){
    const thumb = k => `<svg viewBox="0 0 30 40" width="26" height="34">${LAYOUTS[k].map(([x,y,w,h]) => `<rect x="${2+x*26+1}" y="${2+y*36+1}" width="${w*26-2}" height="${h*36-2}" rx="2" fill="#fff" stroke="#2B2340" stroke-width="2"/>`).join('')}</svg>`;
    optsEl.innerHTML = Object.keys(LAYOUTS).map(k => `<button class="size lay" data-l="${k}" aria-label="comic page with ${LAYOUTS[k].length} boxes">${thumb(k)}</button>`).join('')
      + '<span class="sep"></span>'
      + `<button class="stick ${bubbleKind==='say'?'on':''}" data-b="say" aria-label="speech bubble">💬</button><button class="stick ${bubbleKind==='think'?'on':''}" data-b="think" aria-label="thought bubble">💭</button><button class="stick ${bubbleKind==='shout'?'on':''}" data-b="shout" aria-label="shout bubble">💥</button>`;
    return;
  }
  if(tool === 'shape'){
    optsEl.innerHTML = Object.keys(SHAPES).map(k => `<button class="stick ${k===shapeName?'on':''}" data-sh="${k}" aria-label="${k}" style="color:${color==='#FFFFFF'?'#2B2340':color}">${shapeSVG(k, shapeFill, 30)}</button>`).join('')
      + `<span class="sep"></span><button class="stick" data-fl="1" aria-label="filled or outline" style="width:auto;padding:0 12px;font-size:14px;font-weight:800">${shapeFill ? 'Filled' : 'Outline'}</button><span class="sep"></span>`
      + COLORS.map(c => `<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}" aria-label="color"></button>`).join('');
    return;
  }
  if(tool === 'template'){
    optsEl.innerHTML = TEMPLATES.map(([k,e,n]) => `<button class="tool" data-tp="${k}"><b>${e}</b>${n}</button>`).join('');
    return;
  }
  if(tool === 'sticker'){
    optsEl.innerHTML = STICKERS.map(s => `<button class="stick ${s===sticker?'on':''}" data-s="${s}">${s}</button>`).join('');
  } else {
    const sizes = (tool === 'fill') ? '' : '<span class="sep"></span>' + SIZES.map((s,i) => `<button class="size ${i===size?'on':''}" data-z="${i}" aria-label="size ${i+1}"><i style="width:${6+i*7}px;height:${6+i*7}px"></i></button>`).join('');
    const sw = tool === 'eraser' ? '' : COLORS.map(c => `<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}" aria-label="color"></button>`).join('');
    optsEl.innerHTML = sw + (tool === 'eraser' ? sizes.replace('<span class="sep"></span>','') : sizes);
  }
}
optsEl.onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.l){ snap(); select(null); setItems([]); comicPage(LAYOUTS[b.dataset.l]); save(); toast('Tap 💬 then tap a box to add talking'); return; }
  if(b.dataset.b) bubbleKind = b.dataset.b;
  if(b.dataset.sh) shapeName = b.dataset.sh;
  if(b.dataset.fl){ shapeFill = !shapeFill; if(selected && selected.kind === 'shape'){ snap(); selected.fill = shapeFill; paint(selected); save(); } }
  if(b.dataset.tp){ snap(); select(null); setItems([]); template(b.dataset.tp); save(); toast('Make it yours! (Undo goes back)'); return; }
  if(b.dataset.c){ color = b.dataset.c; if(selected && (selected.kind === 'text' || selected.kind === 'shape')){ selected.color = color; paint(selected); save(); } }
  if(b.dataset.z) size = +b.dataset.z;
  if(b.dataset.s) sticker = b.dataset.s;
  renderOpts();
};

// ---------- history ----------
function snap(){ history.push({img: cv.toDataURL(), items: JSON.stringify(items.map(plain))}); if(history.length > 20) history.shift(); }
function plain(it){ return {kind:it.kind, shape:it.shape, fill:it.fill, text:it.text, x:it.x, y:it.y, s:it.s, r:it.r, color:it.color}; }
document.getElementById('undo').onclick = () => {
  const h = history.pop(); if(!h){ toast('Nothing to undo'); return; }
  select(null); drawImg(h.img, save); setItems(JSON.parse(h.items));
};
document.getElementById('clear').onclick = () => {
  if(!items.length && isBlank()) return;
  snap(); select(null); paper(); setItems([]); save(); toast('Fresh page! (Undo brings it back)');
};
function comicPage(lay){
  paper(); const m = 10, g = 12;
  ctx.save(); ctx.strokeStyle = '#2B2340'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  for(const [x,y,w,h] of lay){
    const L = m + x*(W-2*m) + (x>0 ? g/2 : 0), T = m + y*(H-2*m) + (y>0 ? g/2 : 0);
    const R = m + (x+w)*(W-2*m) - (x+w<1 ? g/2 : 0), B = m + (y+h)*(H-2*m) - (y+h<.999 ? g/2 : 0);
    ctx.strokeRect(L, T, R-L, B-T);
  }
  ctx.restore();
}
function outline(d, x, y, size, fill){
  ctx.save(); ctx.translate(x, y); ctx.scale(size/100, size/100); const p = new Path2D(d);
  if(fill){ ctx.fillStyle = fill; ctx.fill(p); } ctx.strokeStyle = '#2B2340'; ctx.lineWidth = 400/size; ctx.lineJoin = 'round'; ctx.stroke(p); ctx.restore();
}
function bg(top, bottom){ const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(1, bottom); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function confetti(n, cols){ for(let i = 0; i < n; i++){ ctx.fillStyle = cols[i % cols.length]; ctx.globalAlpha = .7; ctx.beginPath(); ctx.arc(Math.random()*W, Math.random()*H, 3 + Math.random()*5, 0, Math.PI*2); ctx.fill(); } ctx.globalAlpha = 1; }
function template(k){
  paper(); const m = Math.min(W, H), T = (text, x, y, s, color, r=0) => addItem({kind:'text', text, x:x*W, y:y*H, s:s*m, r, color});
  const S = (text, x, y, s, r=0) => addItem({kind:'sticker', text, x:x*W, y:y*H, s:s*m, r});
  if(k === 'birthday'){
    bg('#FFE3F1', '#FFF6D6'); confetti(70, ['#FF5E5B','#FFB627','#2EC4B6','#8E5CF7','#3A86FF']);
    T('Happy', .5, .2, .13, '#FF5E5B', -4); T('Birthday!', .5, .34, .15, '#8E5CF7', -4);
    S('🎂', .5, .6, .3); S('🎈', .16, .55, .16, -10); S('🎈', .84, .5, .16, 10); S('🎉', .8, .84, .13); S('🎁', .2, .85, .13);
    T('To: ______', .5, .9, .055, '#2B2340');
  }
  if(k === 'thanks'){
    bg('#DFF7EF', '#E9F0FF'); confetti(40, ['#2EC4B6','#FF6FB5','#FFB627']);
    T('Thank', .5, .22, .16, '#2EC4B6', -3); T('You!', .5, .38, .18, '#FF6FB5', -3);
    S('💐', .5, .65, .28); S('❤️', .2, .6, .1, -12); S('🌟', .8, .58, .1, 12); S('🦋', .78, .84, .1);
    T('From: ______', .5, .89, .055, '#2B2340');
  }
  if(k === 'weekend'){
    comicPage(LAYOUTS.four);
    const sm = Math.max(14, m*.04);
    [['Friday', .06, .04], ['Saturday', .56, .04], ['Sunday', .06, .54], ['Best part!', .56, .54]].forEach(([t, x, y]) => addItem({kind:'shout', text:t, x:x*W + sm*3, y:y*H + sm*1.2, s:sm, r:-3, color:'#2B2340'}));
  }
  if(k === 'color'){
    const gy = H*.8, hs = Math.min(W*.46, H*.4), cx = W*.56;
    ctx.strokeStyle = '#2B2340'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    outline(SHAPES.circle, W*.05, H*.04, Math.min(W, H)*.22, '#fff');
    outline(SHAPES.cloud, W*.58, H*.05, Math.min(W*.36, H*.3), '#fff');
    // house: roof, walls, door, windows
    const hx = cx - hs/2, hy = gy - hs;
    outline('M15 45H85V100H15Z', hx, hy, hs, '#fff'); outline('M50 5L96 46H4Z', hx, hy, hs, '#fff');
    outline('M42 68H58V100H42Z', hx, hy, hs, '#fff'); outline('M22 56H35V69H22Z', hx, hy, hs, '#fff'); outline('M65 56H78V69H65Z', hx, hy, hs, '#fff');
    // tree on the left
    const ts = Math.min(W*.28, H*.34), tx = Math.max(W*.02, hx - ts*.95);
    outline('M44 55H56V100H44Z', tx, gy - ts, ts, '#fff'); outline('M50 4C72 4 90 20 90 38C90 56 72 64 50 64C28 64 10 56 10 38C10 20 28 4 50 4Z', tx, gy - ts, ts, '#fff');
    // flowers along the bottom
    const fs = Math.min(W*.14, H*.12);
    const base = H - (H-gy)*.1, f2 = fs*.8;
    for(let i = 0; i < 4; i++){ const fx = W*.06 + i*(W*.88 - fs)/3; outline('M48 50H52V100H48Z', fx, base - fs, fs, '#fff'); outline(SHAPES.star, fx + fs/2 - f2/2, base - fs/2 - f2*.86, f2, '#fff'); }
    toast('Pick Fill 🪣 and tap to color it in');
  }
  if(k === 'sea'){
    bg('#9EE7FF', '#2F7DD1'); ctx.fillStyle = '#F6D58E'; ctx.beginPath(); ctx.ellipse(W/2, H*1.02, W*.8, H*.16, 0, 0, Math.PI*2); ctx.fill();
    for(let i = 0; i < 25; i++){ ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.random()*W, Math.random()*H*.8, 3 + Math.random()*9, 0, Math.PI*2); ctx.stroke(); }
    S('🐠', .25, .3, .14); S('🐟', .72, .2, .11, 8); S('🐙', .7, .62, .2); S('🐚', .2, .9, .09); S('🦀', .5, .92, .1); S('🪸', .88, .86, .14); S('🐳', .32, .55, .18, -6);
  }
}
function isBlank(){ const d = ctx.getImageData(0,0,cv.width,cv.height).data; for(let i=0;i<d.length;i+=4*97) if(d[i]!==255||d[i+1]!==255||d[i+2]!==255) return false; return true; }

// ---------- drawing ----------
let drawing = null;
cv.addEventListener('pointerdown', e => {
  const p = pt(e);
  if(textIn) { commitText(); return; }
  if(selected){ select(null); if(tool==='sticker'||tool==='shape') return; }
  if(tool === 'fill'){ snap(); flood(p.x, p.y, color); save(); return; }
  if(tool === 'shape'){ snap(); select(addItem({kind:'shape', shape:shapeName, fill:shapeFill, text:'', x:p.x, y:p.y, s:110, r:0, color})); save(); return; }
  if(tool === 'sticker'){ snap(); select(addItem({kind:'sticker', text:sticker, x:p.x, y:p.y, s:64, r:0})); save(); return; }
  if(tool === 'text'){ e.preventDefault(); openText(p, 'text'); return; }
  if(tool === 'comic'){ e.preventDefault(); openText(p, bubbleKind); return; }
  snap(); cv.setPointerCapture(e.pointerId);
  drawing = {last:p, pts:[p], base: tool === 'marker' ? ctx.getImageData(0,0,cv.width,cv.height) : null};
  stroke(p, p);
});
cv.addEventListener('pointermove', e => {
  if(!drawing) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  if(drawing.base){
    // marker: redraw the whole stroke each time so overlaps don't stack into dots
    for(const ev of evs) drawing.pts.push(pt(ev));
    ctx.putImageData(drawing.base, 0, 0); markerPath(drawing.pts); return;
  }
  for(const ev of evs){ const p = pt(ev); stroke(drawing.last, p); drawing.last = p; }
});
const end = () => { if(drawing){ drawing = null; save(); } };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
function pt(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function markerPath(pts){
  ctx.save(); ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.globalAlpha = .4; ctx.globalCompositeOperation = 'multiply';
  ctx.lineWidth = SIZES[size]*2.4; ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(const q of pts) ctx.lineTo(q.x, q.y); if(pts.length === 1) ctx.lineTo(pts[0].x + .01, pts[0].y);
  ctx.stroke(); ctx.restore();
}
function stroke(a, b){
  if(tool === 'marker'){ markerPath([a, b]); return; }
  ctx.save();
  ctx.lineCap = ctx.lineJoin = 'round';
  const w = SIZES[size];
  if(tool === 'eraser'){ ctx.strokeStyle = '#fff'; ctx.lineWidth = w*2.2; }
  else if(tool === 'marker'){ ctx.strokeStyle = color; ctx.globalAlpha = .35; ctx.lineWidth = w*2.4; ctx.globalCompositeOperation = 'multiply'; }
  else { ctx.strokeStyle = color; ctx.lineWidth = w; }
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x + .01, b.y); ctx.stroke(); ctx.restore();
}

// ---------- paint bucket ----------
function flood(x0, y0, hex){
  const w = cv.width, h = cv.height, X = Math.floor(x0*DPR), Y = Math.floor(y0*DPR);
  const img = ctx.getImageData(0,0,w,h), d = img.data, at = (X + Y*w)*4;
  const t = [d[at],d[at+1],d[at+2]], f = [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
  if(Math.abs(t[0]-f[0])+Math.abs(t[1]-f[1])+Math.abs(t[2]-f[2]) < 8) return;
  const TOL = 90, seen = new Uint8Array(w*h);
  const ok = i => { const k = i*4; return !seen[i] && Math.abs(d[k]-t[0])+Math.abs(d[k+1]-t[1])+Math.abs(d[k+2]-t[2]) <= TOL; };
  const stack = [X + Y*w];
  while(stack.length){
    let i = stack.pop(); if(!ok(i)) continue;
    const y = (i / w) | 0; let l = i, r = i;
    while(l % w > 0 && ok(l-1)) l--;
    while(r % w < w-1 && ok(r+1)) r++;
    for(let j = l; j <= r; j++){
      seen[j] = 1; const k = j*4; d[k]=f[0]; d[k+1]=f[1]; d[k+2]=f[2]; d[k+3]=255;
      if(y > 0 && ok(j-w)) stack.push(j-w);
      if(y < h-1 && ok(j+w)) stack.push(j+w);
    }
  }
  // soften the edge: grow the fill one pixel into the anti-aliased outline
  for(let i = 0; i < w*h; i++){ if(seen[i]) continue; const n = (i%w>0&&seen[i-1])||(i%w<w-1&&seen[i+1])||(i>=w&&seen[i-w])||(i<w*(h-1)&&seen[i+w]); if(n){ const k=i*4; if(d[k]+d[k+1]+d[k+2] > 600){ d[k]=f[0]; d[k+1]=f[1]; d[k+2]=f[2]; } } }
  ctx.putImageData(img, 0, 0);
}

// ---------- stickers and words ----------
function addItem(it){
  it.el = document.createElement('div'); it.el.className = 'item'; stage.appendChild(it.el);
  items.push(it); paint(it); drag(it); return it;
}
function setItems(list){ items.forEach(it => it.el.remove()); items = []; list.forEach(addItem); }
function paint(it){
  it.el.className = 'item' + (it.kind==='say'||it.kind==='think'||it.kind==='shout' ? ' bub ' + it.kind : '') + (it === selected ? ' sel' : '');
  if(it.kind === 'shape'){ it.el.innerHTML = shapeSVG(it.shape, it.fill, it.s); it.el.style.fontSize = ''; }
  else { it.el.textContent = it.text; it.el.style.fontSize = it.s + 'px'; }
  it.el.style.color = it.kind === 'sticker' ? '' : it.color;
  it.el.style.textShadow = it.kind === 'text' && it.color === '#FFFFFF' ? '0 0 3px #2B2340' : '';
  const w = it.el.offsetWidth, h = it.el.offsetHeight;
  it.el.style.transform = `translate(${it.x - w/2}px, ${it.y - h/2}px) rotate(${it.r}deg)`;
  if(it === selected) place();
}
function drag(it){
  let start = null;
  it.el.addEventListener('pointerdown', e => {
    e.stopPropagation(); if(textIn) commitText();
    select(it); snap(); it.el.setPointerCapture(e.pointerId);
    start = {px:e.clientX, py:e.clientY, x:it.x, y:it.y, moved:false};
  });
  it.el.addEventListener('pointermove', e => {
    if(!start) return;
    const dx = e.clientX - start.px, dy = e.clientY - start.py;
    if(Math.abs(dx) + Math.abs(dy) > 3) start.moved = true;
    it.x = Math.max(0, Math.min(W, start.x + dx)); it.y = Math.max(0, Math.min(H, start.y + dy)); paint(it);
  });
  const up = () => { if(!start) return; if(!start.moved) history.pop(); start = null; save(); };
  it.el.addEventListener('pointerup', up); it.el.addEventListener('pointercancel', up);
}
function select(it){
  items.forEach(i => i.el.classList.toggle('sel', i === it));
  selected = it; ctl.classList.toggle('on', !!it); if(it) place();
}
function place(){
  const w = selected.el.offsetWidth * 1, h = selected.el.offsetHeight;
  let top = selected.y + h/2 + 14; if(top > H - 50) top = selected.y - h/2 - 56;
  const left = Math.max(6, Math.min(W - 182, selected.x - 88));
  ctl.style.left = left + 'px'; ctl.style.top = Math.max(6, top) + 'px';
}
ctl.onclick = e => {
  const b = e.target.closest('button'); if(!b || !selected) return; snap();
  const a = b.dataset.a, it = selected;
  if(a === 'bigger') it.s = Math.min(it.kind === 'shape' ? 700 : 320, it.s * 1.25);
  if(a === 'smaller') it.s = Math.max(16, it.s / 1.25);
  if(a === 'turn') it.r = (it.r + 15) % 360;
  if(a === 'del'){ it.el.remove(); items = items.filter(i => i !== it); select(null); save(); return; }
  paint(it); save();
};

let textIn = null;
function openText(p, kind){
  textIn = document.createElement('input'); textIn.className = 'textin'; textIn.maxLength = 60;
  textIn.placeholder = 'Type here'; textIn.style.color = color === '#FFFFFF' ? '#2B2340' : color; textIn.style.fontSize = '24px';
  textIn.style.left = Math.max(6, Math.min(W - 200, p.x - 80)) + 'px'; textIn.style.top = Math.max(6, Math.min(H - 60, p.y - 22)) + 'px';
  textIn._p = p; textIn._k = kind; if(kind !== 'text'){ textIn.style.color = '#2B2340'; textIn.placeholder = kind === 'think' ? 'What are they thinking?' : 'What do they say?'; }
   stage.appendChild(textIn); textIn.focus();
  textIn.addEventListener('keydown', e => { if(e.key === 'Enter') commitText(); });
  textIn.addEventListener('blur', () => setTimeout(commitText, 0));
}
function commitText(){
  if(!textIn) return; const t = textIn.value.trim(), p = textIn._p, textIn_k = textIn._k; textIn.remove(); textIn = null;
  if(!t) return; snap(); const k = textIn_k;
  select(addItem(k === 'text' ? {kind:'text', text:t, x:p.x, y:p.y, s:[28,40,60][size], r:0, color} : {kind:k, text:t, x:p.x, y:p.y, s:[18,22,30][size], r:0, color:'#2B2340'})); save();
}

// ---------- autosave and export ----------
let saveTimer = null;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => store.set('doodle.v1', {img: cv.toDataURL('image/png'), items: items.map(plain)}), 300); }
function compose(){
  const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
  const o = out.getContext('2d'); o.drawImage(cv, 0, 0); o.scale(DPR, DPR);
  for(const it of items){
    o.save(); o.translate(it.x, it.y); o.rotate(it.r * Math.PI/180);
    o.font = `900 ${it.s}px ui-rounded, system-ui, sans-serif`; o.textAlign = 'center'; o.textBaseline = 'middle';
    if(it.kind === 'say' || it.kind === 'think' || it.kind === 'shout'){ bubble(o, it); o.restore(); continue; }
    if(it.kind === 'shape'){ o.scale(it.s/100, it.s/100); o.translate(-50, -50); const path = new Path2D(SHAPES[it.shape]);
      if(it.fill){ o.fillStyle = it.color; o.fill(path); } else { o.strokeStyle = it.color; o.lineWidth = 7; o.lineJoin = 'round'; o.stroke(path); } o.restore(); continue; }
    o.fillStyle = it.kind === 'text' ? it.color : '#000';
    if(it.kind === 'text' && it.color === '#FFFFFF'){ o.shadowColor = '#2B2340'; o.shadowBlur = 3; }
    o.fillText(it.text, 0, it.s*0.05); o.restore();
  }
  return out;
}
function bubble(o, it){
  const txt = it.kind === 'shout' ? it.text.toUpperCase() : it.text;
  o.font = `${it.kind==='shout'?900:800} ${it.s}px ui-rounded, system-ui, sans-serif`;
  const w = it.el.offsetWidth, h = it.el.offsetHeight, x = -w/2, y = -h/2;
  o.lineWidth = 3; o.strokeStyle = '#2B2340'; o.lineJoin = 'round';
  if(it.kind === 'shout'){
    o.fillStyle = '#2B2340'; o.fillRect(x+4, y+4, w, h); o.fillStyle = '#FFE14D'; o.fillRect(x, y, w, h); o.strokeRect(x+1.5, y+1.5, w-3, h-3);
  } else {
    const tx = x + w*.22;
    o.fillStyle = '#fff'; o.beginPath();
    if(it.kind === 'think') o.ellipse(0, 0, w/2-1.5, h/2-1.5, 0, 0, Math.PI*2);
    else o.roundRect(x+1.5, y+1.5, w-3, h-3, (h-3)/2);
    o.fill(); o.stroke();
    if(it.kind === 'say'){
      o.beginPath(); o.moveTo(tx, h/2-3); o.lineTo(tx+4, h/2+14); o.lineTo(tx+16, h/2-3); o.fill(); o.stroke();
      o.fillRect(tx+1, h/2-6, 14, 5);
    } else {
      for(const [cx, cy, r] of [[tx+9, h/2+8, 7.5], [tx-1, h/2+22, 5]]){ o.beginPath(); o.arc(cx, cy, r, 0, Math.PI*2); o.fill(); o.stroke(); }
    }
  }
  o.fillStyle = '#2B2340'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText(txt, 0, it.s*0.05);
}
// ---------- post to the family art wall ----------
const modal = document.getElementById('modal'), sheet = document.getElementById('sheet');
modal.onclick = e => { if(e.target === modal) modal.classList.add('hidden'); };
const shrink = (src, max, q) => new Promise(res => {
  const k = Math.min(1, max / Math.max(src.width, src.height)), c = document.createElement('canvas');
  c.width = Math.round(src.width*k); c.height = Math.round(src.height*k);
  const o = c.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0, 0, c.width, c.height); o.drawImage(src, 0, 0, c.width, c.height);
  c.toBlob(b => res({blob:b, w:c.width, h:c.height}), 'image/jpeg', q);
});
let artist = store.get('doodle.artist', null);
document.getElementById('post').onclick = async () => {
  select(null); if(textIn) commitText();
  if(!FAMILY){
    sheet.innerHTML = `<h2>Post to the family wall</h2><p>Posting works inside the family area, where only family can see it. Save this drawing first, then open Doodle Studio from the family area.</p>
      <div class="acts"><button class="btn" id="mclose">Not now</button><a class="btn save" href="https://family.nikhilharsh.com/draw/">Open family Doodle</a></div>`;
    modal.classList.remove('hidden'); document.getElementById('mclose').onclick = () => modal.classList.add('hidden'); return;
  }
  const art = compose(), preview = art.toDataURL('image/jpeg', .7);
  sheet.innerHTML = `<h2>Post to the family wall 📌</h2><img src="${preview}" alt="Your drawing">
    <p>Who made it?</p><div class="who" id="who">${['Zara','Samir','Mom','Dad'].map(n => `<button data-n="${n}" class="${n===artist?'on':''}">${n}</button>`).join('')}</div>
    <input id="ttl" maxlength="60" placeholder="Give it a name (optional)">
    <div class="acts"><button class="btn" id="mclose">Cancel</button><button class="btn post" id="mpost">Post it!</button></div>`;
  modal.classList.remove('hidden');
  document.getElementById('who').onclick = e => { const b = e.target.closest('button'); if(!b) return; artist = b.dataset.n; store.set('doodle.artist', artist); document.querySelectorAll('#who button').forEach(x => x.classList.toggle('on', x === b)); };
  document.getElementById('mclose').onclick = () => modal.classList.add('hidden');
  document.getElementById('mpost').onclick = async ev => {
    if(!artist){ toast('Tap who made it first'); return; }
    const btn = ev.currentTarget; btn.disabled = true; btn.textContent = 'Posting...';
    try{
      let full = await shrink(art, 1400, .85); if(full.blob.size > 1700000) full = await shrink(art, 1100, .7);
      const thumb = await shrink(art, 420, .75);
      const f = new FormData(); f.append('full', full.blob, 'full.jpg'); f.append('thumb', thumb.blob, 'thumb.jpg');
      f.append('artist', artist); f.append('title', document.getElementById('ttl').value); f.append('w', full.w); f.append('h', full.h);
      const r = await fetch('/api/art', {method:'POST', body:f, credentials:'same-origin'}); const d = await r.json().catch(() => ({}));
      if(!r.ok || !d.ok) throw new Error(d.error || 'could not post');
      modal.classList.add('hidden'); toast('Posted to the family wall! 🎉');
    }catch(e){ btn.disabled = false; btn.textContent = 'Try again'; toast('Oops: ' + e.message); }
  };
};
document.getElementById('save').onclick = () => {
  select(null);
  compose().toBlob(async blob => {
    const name = 'doodle-' + new Date().toLocaleDateString('en-CA') + '.png';
    const file = new File([blob], name, {type:'image/png'});
    try{
      // phones and iPads get the share sheet (Save Image); Chromebooks and computers download straight to Downloads
      const mobile = /iPhone|iPad|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      if(mobile && !/CrOS/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'My doodle'}); return; }
    }catch(e){ if(e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Saved to your Downloads folder!');
  }, 'image/png');
};
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600); }

// ---------- start ----------
let rt = null;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { fit(); items.forEach(it => { it.x = Math.min(it.x, W - 20); it.y = Math.min(it.y, H - 20); paint(it); }); }, 150); });
fit(); renderOpts();
const saved = store.get('doodle.v1', null);
if(saved){ drawImg(saved.img); setItems(saved.items || []); }
})();
</script>
</body>
