<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chess Club</title>
<meta name="theme-color" content="#FFF6E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#2B2340;--muted:#6B6485;--cream:#FFF6E9;--light:#FFF1D9;--dark:#7CCBB6;--sun:#FFB627;--coral:#FF5E5B;--aqua:#2EC4B6;--grape:#8E5CF7;--pink:#FF6FB5}
html,body{margin:0;min-height:100%;background:var(--cream);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:1100px;margin:0 auto}
header h1{margin:0 auto 0 4px;font-size:clamp(18px,5vw,24px);white-space:nowrap;font-weight:900;letter-spacing:-.02em}
header h1 span{color:var(--grape)}
.btn{white-space:nowrap;font:inherit;font-weight:800;font-size:15px;border:0;border-radius:14px;padding:10px 14px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(43,35,64,.15);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.pri{background:var(--aqua);color:#fff}
.btn.sun{background:var(--sun)}
.btn.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
@media (max-width:480px){.btn.hub span{display:none}header{gap:6px;padding:10px 8px}}
.tabs{display:flex;gap:8px;justify-content:center;padding:0 12px 8px}
.tab{font:inherit;font-weight:900;font-size:16px;border:0;border-radius:999px;padding:10px 18px;background:#fff;color:var(--muted);box-shadow:0 2px 0 rgba(43,35,64,.12);cursor:pointer}
.tab.on{background:var(--ink);color:#fff}

main{max-width:1100px;margin:0 auto;padding:0 12px 20px;display:grid;gap:12px;justify-items:center}
@media (min-width:900px){main{grid-template-columns:auto minmax(300px,380px);align-items:start;justify-content:center;column-gap:22px}}
.boardcol{display:grid;gap:8px;width:var(--bs)}
:root{--bs:min(94vw,600px,calc(100dvh - 270px))}
@media (min-width:900px){:root{--bs:min(620px,calc(100dvh - 250px))}}
@supports not (height:100dvh){:root{--bs:min(94vw,600px)}}
.board{position:relative;width:var(--bs);height:var(--bs);border-radius:18px;overflow:hidden;box-shadow:0 0 0 6px #fff,0 10px 30px rgba(43,35,64,.18);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:none}
.board.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.sq{position:relative;display:grid;place-items:center;cursor:pointer}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(255,182,39,.45)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(255,200,60,.8)}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(142,92,247,.45);animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{background:rgba(142,92,247,.15)}}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,94,91,.95) 0,rgba(255,94,91,.55) 45%,transparent 75%)}
.sq.bad::before{content:"";position:absolute;inset:0;background:rgba(255,94,91,.55)}
.sq.good::before{content:"";position:absolute;inset:0;background:rgba(46,196,182,.6)}
.sq .dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(43,35,64,.22);z-index:2;pointer-events:none}
.sq .ring{position:absolute;inset:5%;border-radius:50%;border:5px solid rgba(43,35,64,.22);z-index:2;pointer-events:none}
.sq.over::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px #fff;z-index:2}
.sq .pc{width:92%;height:92%;position:relative;z-index:3;pointer-events:none;transition:transform .12s}
.sq.sel .pc{transform:scale(1.08) translateY(-3%)}
.sq .pc.ghosted{opacity:.25}
.coord{position:absolute;font-size:clamp(9px,1.8vw,12px);font-weight:900;z-index:1;pointer-events:none}
.coord.f{right:4px;bottom:2px}.coord.r{left:4px;top:2px}
.sq.l .coord{color:var(--cl,#5DB49D)}.sq.d .coord{color:var(--cd,#FFF1D9)}
body{transition:background .3s}
.pixel .board{border-radius:6px}
.pixel .sq{box-shadow:inset -3px -3px 0 rgba(0,0,0,.14),inset 3px 3px 0 rgba(255,255,255,.16)}
.pixel .sq .pc{width:86%;height:86%}
.drag{position:fixed;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(43,35,64,.3))}
.fly{position:fixed;z-index:40;pointer-events:none;transition:transform .32s cubic-bezier(.3,.7,.3,1)}

.pbar{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 2px 0 rgba(43,35,64,.1);min-height:48px;transition:box-shadow .2s,background .2s}
.pbar.turn{box-shadow:0 0 0 3px var(--sun),0 2px 0 rgba(43,35,64,.1);background:#FFFBF2}
.pbar .av{width:32px;height:32px;flex:none}
.pbar b{font-size:16px;font-weight:900;white-space:nowrap}
.pbar .caps{display:flex;flex-wrap:wrap;align-items:center;margin-left:auto;min-width:0}
.pbar .caps svg{width:20px;height:20px;margin-left:-5px}
.pbar .plus{font-weight:900;color:var(--muted);font-size:14px;margin-left:4px}

.side{display:grid;gap:12px;width:min(94vw,600px)}
@media (min-width:900px){.side{width:auto}}
.card{background:#fff;border-radius:20px;padding:14px;box-shadow:0 2px 0 rgba(43,35,64,.1)}
.coach{display:flex;gap:10px;align-items:center}
.coach .owl{font-size:40px;line-height:1;flex:none;animation:bob 2.4s ease-in-out infinite}
.coach .owl.hop{animation:hop .6s}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}}
.bubble{position:relative;background:var(--cream);border-radius:16px;padding:10px 14px;font-weight:800;font-size:17px;line-height:1.3;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--cream)}
.bubble small{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto;justify-content:center}
.toggle{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;cursor:pointer}
.toggle input{display:none}
.toggle i{width:46px;height:28px;border-radius:999px;background:#E4DFEE;position:relative;flex:none;transition:background .2s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.toggle input:checked + i{background:var(--aqua)}
.toggle input:checked + i::after{left:21px}
.moves{display:flex;flex-wrap:wrap;gap:4px 10px;font-weight:800;font-size:14px;color:var(--muted);max-height:120px;overflow:auto;user-select:text;-webkit-user-select:text}
.moves span b{color:var(--ink)}
.moves:empty::before{content:"Moves will show up here.";font-weight:700}
h3{margin:0 0 8px;font-size:15px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:9px 14px;background:var(--cream);color:var(--ink);cursor:pointer}
.chip.on{background:var(--grape);color:#fff}
.chip.lv.on{background:var(--sun);color:var(--ink)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--cream);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.src{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.src a{color:inherit}
.hidden{display:none!important}

.modal{position:fixed;inset:0;z-index:60;background:rgba(43,35,64,.45);display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:16px;overflow:auto}
.sheet{background:var(--cream);border-radius:24px;padding:22px;width:min(380px,100%);display:grid;gap:14px;text-align:center;box-shadow:0 20px 50px rgba(43,35,64,.3);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.sheet h2{margin:0;font-size:26px;font-weight:900}
.sheet p{margin:0;color:var(--muted);font-weight:700}
.sheet .big{font-size:56px;line-height:1}
.sheet.wide{width:min(460px,100%);text-align:left}
.sheet,.sheet>div{grid-template-columns:minmax(0,1fr)}
.sheet *{min-width:0}
.sheet .center{text-align:center}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{font:inherit;font-weight:900;font-size:17px;border:0;border-radius:999px;padding:10px 16px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(43,35,64,.12);cursor:pointer;position:relative}
.pick button.on{background:var(--grape);color:#fff}
.pick button .n{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:var(--ink);font-size:13px;display:grid;place-items:center}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;border:2px solid rgba(43,35,64,.15);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.coinwrap{perspective:700px;display:grid;place-items:center;height:150px}
.coin{width:120px;height:120px;position:relative;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.2,.7,.2,1)}
.coin .face{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font-size:54px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:radial-gradient(circle at 35% 30%,#FFE58A,#FFB627 60%,#E39400);box-shadow:inset 0 0 0 7px #F2A900,inset 0 0 0 10px #FFD45E,0 10px 20px rgba(43,35,64,.2)}
.coin .face small{position:absolute;bottom:16px;font-size:13px;font-weight:900;color:#7A4E00;letter-spacing:.06em}
.coin .t{transform:rotateY(180deg)}
.coin.toss{animation:toss 1.8s cubic-bezier(.3,.6,.4,1)}
@keyframes toss{40%{translate:0 -60px}}
.stbl{width:100%;border-collapse:collapse;font-weight:800}
.stbl th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:4px}
.stbl th:first-child,.stbl td:first-child{text-align:left}
.stbl td{padding:9px 4px;border-top:1px solid rgba(43,35,64,.08);text-align:center;font-size:16px}
.stbl .del{border:0;background:none;font-size:16px;cursor:pointer;opacity:.5}
.looks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.looks button{font:inherit;font-weight:900;font-size:15px;border:0;border-radius:18px;padding:8px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 rgba(43,35,64,.12);display:grid;gap:6px;justify-items:center}
.looks button.on{box-shadow:0 0 0 3px var(--grape)}
.looks .mini{display:grid;grid-template-columns:repeat(3,1fr);width:100%;border-radius:12px;overflow:hidden}
.looks .mini span{aspect-ratio:1;display:grid;place-items:center}
.looks .mini svg{width:92%;height:92%}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo button{border:0;background:#fff;border-radius:16px;padding:6px;cursor:pointer;box-shadow:0 2px 0 rgba(43,35,64,.12)}
.promo button:active{transform:translateY(2px)}
.promo svg{width:100%;display:block}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.coach .owl,.btn.pulse,.sq.hint::before{animation:none}.fly{transition:none}}
</style>
</head>
<body>
<header>
  <a class="btn hub" href="https://nikhilharsh.com" aria-label="Back to the family hub">🏡<span> Family hub</span></a>
  <h1>Chess <span>Club</span></h1>
  <button class="btn" id="lookBtn" aria-label="Change theme">🎨</button>
  <button class="btn" id="mute" aria-label="Sound on or off">🔊</button>
</header>
<div class="tabs" role="tablist">
  <button class="tab on" id="tabPlay" role="tab">👫 2 Players</button>
  <button class="tab" id="tabPuz" role="tab">🧩 Puzzles</button>
</div>

<main>
  <div class="boardcol">
    <div class="pbar" id="barTop"></div>
    <div class="board" id="board" aria-label="Chess board"></div>
    <div class="pbar" id="barBot"></div>
  </div>

  <div class="side">
    <div class="card coach"><div class="owl" id="owl" aria-hidden="true">🦉</div><div class="bubble" id="say">Hi! Let's play chess.</div></div>

    <!-- 2 player panel -->
    <div id="playPanel" class="side" style="width:auto">
      <div class="card row">
        <button class="btn" id="undo">↩️ Undo</button>
        <button class="btn" id="flip">🔄 Flip</button>
        <button class="btn sun" id="newGame">✨ New game</button>
      </div>
      <div class="card row"><button class="btn" id="statsBtn">🏅 Player stats</button></div>
      <div class="card"><label class="toggle"><input type="checkbox" id="autoflip"><i></i>Turn the board after each move</label></div>
      <div class="card"><h3>Moves</h3><div class="moves" id="moves"></div></div>
    </div>

    <!-- puzzle panel -->
    <div id="puzPanel" class="side hidden" style="width:auto">
      <div class="card">
        <h3>Who's solving?</h3>
        <div class="chips" id="solvers"></div>
      </div>
      <div class="card">
        <h3>Pick a puzzle</h3>
        <div class="chips" id="themes"></div>
      </div>
      <div class="card">
        <h3>How hard?</h3>
        <div class="chips" id="levels"></div>
      </div>
      <div class="card row">
        <button class="btn" id="hint">💡 Hint</button>
        <button class="btn" id="show">👀 Show me</button>
        <button class="btn pri" id="next">Next ➡️</button>
      </div>
      <div class="card stats">
        <div class="stat"><b id="stSolved">0</b><span>⭐ Solved</span></div>
        <div class="stat"><b id="stStreak">0</b><span>🔥 Streak</span></div>
        <div class="stat"><b id="stBest">0</b><span>🏆 Best streak</span></div>
      </div>
      <div class="src" id="src"></div>
    </div>
  </div>
</main>

<div class="modal hidden" id="promoModal"><div class="sheet"><h2>Pick a new piece!</h2><div class="promo" id="promoBtns"></div></div></div>
<div class="modal hidden" id="endModal"><div class="sheet"><div class="big" id="endBig">🏆</div><h2 id="endTitle"></h2><p id="endText"></p><div class="row"><button class="btn" id="endLook">👀 Look at board</button><button class="btn" id="endPlayers">👫 New players</button><button class="btn sun" id="endNew">🔁 Rematch</button></div><p style="font-size:13px">Rematch swaps colors.</p></div></div>
<div class="modal hidden" id="setupModal"><div class="sheet wide">
  <div id="stepNames" style="display:grid;gap:12px">
    <h2>Who's playing?</h2>
    <p>Tap two players. You take turns calling the coin.</p>
    <div class="pick" id="pickNames"></div>
    <div class="addrow"><input id="newName" maxlength="14" placeholder="Add a new name" autocomplete="off"><button class="btn" id="addName">➕ Add</button></div>
    <div class="row"><button class="btn" id="setupCancel">Cancel</button><button class="btn" id="quick">Skip names</button><button class="btn sun" id="toCoin" disabled>🪙 Flip a coin</button></div>
  </div>
  <div id="stepCoin" class="hidden center" style="display:grid;gap:12px">
    <h2 id="coinTitle"></h2>
    <div class="coinwrap"><div class="coin" id="coin"><div class="face h">👑<small>HEADS</small></div><div class="face t">⭐<small>TAILS</small></div></div></div>
    <p id="coinText"></p>
    <div class="row" id="coinBtns"></div>
  </div>
</div></div>
<div class="modal hidden" id="statsModal"><div class="sheet wide">
  <h2>🏅 Player stats</h2>
  <div id="statsBody"></div>
  <div class="row"><button class="btn sun" id="statsClose">Done</button></div>
</div></div>
<div class="modal hidden" id="lookModal"><div class="sheet wide">
  <h2>🎨 Pick a theme</h2>
  <div class="looks" id="looks"></div>
  <div class="row"><button class="btn sun" id="lookClose">Done</button></div>
</div></div>

<script src="engine.js"></script>

  var st = view.st, html = '', checkSq = -1;
  if (C.inCheck(st)) checkSq = st.board.indexOf(st.turn === 'w' ? 'K' : 'k');
  for (var vi = 0; vi < 64; vi++){
    var i = view.orient === 'w' ? vi : 63 - vi;
    var r = Math.floor(i / 8), c = i % 8, light = (r + c) % 2 === 0;
    var cls = 'sq ' + (light ? 'l' : 'd');
    if (view.last && (view.last.from === i || view.last.to === i)) cls += ' last';
    if (i === view.selected) cls += ' sel';
    if (i === view.hint) cls += ' hint';
    if (i === checkSq) cls += ' check';
    if (view.flash && view.flash.sq === i) cls += ' ' + view.flash.cls;
    var inner = '';

  view.hint = -1;

  var ms = C.legalMoves(view.st).filter(function(m){ return m.from === from && m.to === to; });
  clearSel();
  if (!ms.length){ render(); return; }
  if (ms.length > 1){ // promotion
    askPromo(view.st.turn, function(pc){
      var m = ms.filter(function(x){ return x.promo.toLowerCase() === pc; })[0];

}

  var i = +s.dataset.sq;

  if (mine(i)){
    if (view.selected !== i) { select(i); sfx.click(); }
    drag = { from: i, x: e.clientX, y: e.clientY, moved: false, ghost: null, wasSel: true };

/* server sync: every change is queued as a small event and sent to /api/chess; the server copy wins on load.

    .then(function(r){ if (!r.ok) throw new Error(r.status); syncQ = syncQ.slice(batch.length); save('syncq', syncQ); flushing = null; return flush(); })
    .catch(function(){ flushing = null; });

}

    .then(function(d){

var game = null;

function newGame(white, black){
  game = { start: C.START, ucis: [], white: white || '', black: black || '', rec: null };
  saveGame(); rebuild();
}
function nameOf(color){ var n = color === 'w' ? game.white : game.black; return n || (color === 'w' ? 'White' : 'Black'); }
// keep each player's win/loss record in step with the game (undo after a finish takes the result back)
function syncRecord(){
  var s = C.status(game.st, game.keys);
  var want = s.over ? (s.result === 'checkmate' ? s.winner : 'd') : null;
  if (game.rec === want) return;
  if (game.white && game.black){
    var W = rec(game.white), B = rec(game.black);
    var apply = function(r, k){ if (r === 'w'){ W.w += k; B.l += k; } else if (r === 'b'){ B.w += k; W.l += k; } else if (r === 'd'){ W.d += k; B.d += k; } };
    if (game.rec){ apply(game.rec, -1); push({ t: 'game', white: game.white, black: game.black, r: game.rec, k: -1 }); }
    if (want){ apply(want, 1); push({ t: 'game', white: game.white, black: game.black, r: want, k: 1 }); }
    save('players', roster);
  }
  game.rec = want; saveGame();
}
function rebuild(){
  var st = C.parseFEN(game.start), keys = [C.posKey(st)], sans = [], last = null;
  var ok = [];

/* Turn a Lichess API puzzle into {fen, setup, solution} */
function fromLichess(d){
  var toks = d.game.pgn.replace(/\{[^}]*\}/g, ' ').replace(/\d+\.(\.\.)?/g, ' ').split(/\s+/)
    .filter(function(t){ return t && !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t); });
  var st = C.parseFEN(C.START), states = [st], moves = [];
  for (var i = 0; i < toks.length; i++){
    var m = C.findSan(st, toks[i]); if (!m) throw new Error('pgn');
    st = C.makeMove(st, m); states.push(st); moves.push(m);
  }
  var sol = d.puzzle.solution;
  for (var k = states.length - 1; k >= 1; k--){
    if (C.findUci(states[k], sol[0])){
      return { id: d.puzzle.id, fen: C.toFEN(states[k - 1]), setup: C.uci(moves[k - 1]), solution: sol,
        rating: d.puzzle.rating, themes: d.puzzle.themes || [], source: 'lichess' };
    }
  }
  throw new Error('nomatch');
}
function fetchLichess(theme, level){
  var url = 'https://lichess.org/api/puzzle/next?difficulty=' + level + (theme !== 'mix' ? '&angle=' + theme : '');
  var ctl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ ctl && ctl.abort(); }, 8000);
  return fetch(url, { headers: { Accept: 'application/json' }, signal: ctl && ctl.signal })
    .then(function(r){ clearTimeout(to); if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(fromLichess);
}
function backupPuzzle(theme){
  var pool = theme === 'mateIn1' ? BACKUP.mateIn1 : theme === 'mateIn2' ? BACKUP.mateIn2 :
    theme === 'mix' ? BACKUP.mateIn1.concat(BACKUP.mateIn2, BACKUP.tactic) : BACKUP.tactic.concat(BACKUP.mateIn1);
  var p = pool[Math.floor(Math.random() * pool.length)];
  return { fen: p.fen, mate: p.mate || 0, solution: p.solution || [], source: 'backup', themes: [] };
}
function getPuzzle(){
  var theme = pz.theme, level = pz.level;
  var tries = 0;
  function go(){
    return fetchLichess(theme, level).then(function(p){
      if (pz.seen.indexOf(p.id) >= 0 && tries++ < 2) return go();
      return p;
    });
  }
  return go().catch(function(){ return backupPuzzle(theme); }).then(function(p){ p.theme = theme; p.level = level; return p; });
}
function prefetch(){
  if (fetching || nextReady) return;
  fetching = getPuzzle().then(function(p){ fetching = null; if (p.theme === pz.theme && p.level === pz.level) nextReady = p; });
}

function nextPuzzle(){
  view.interactive = false; clearSel(); view.hint = -1; view.flash = null;
  $('next').classList.remove('pulse');
  say('Finding a puzzle…', '');
  var p;
  if (nextReady && nextReady.theme === pz.theme && nextReady.level === pz.level){ p = Promise.resolve(nextReady); nextReady = null; }
  else p = (fetching || Promise.resolve()).then(function(){
    if (nextReady && nextReady.theme === pz.theme && nextReady.level === pz.level){ var x = nextReady; nextReady = null; return x; }
    return getPuzzle();
  });
  p.then(startPuzzle);
}

function startPuzzle(p){
  if (mode !== 'puzzle') { nextReady = p; return; }
  var st = C.parseFEN(p.fen);
  cur = { p: p, st: st, ply: 0, mistakes: 0, helped: false, done: false, solver: '', mateLeft: p.mate || 0 };
  if (p.setup){
    var sm = C.findUci(st, p.setup);
    cur.solver = st.turn === 'w' ? 'b' : 'w';
    view.st = st; view.orient = cur.solver; view.last = null; view.interactive = false; clearSel(); render();
    puzzleBars();
    setTimeout(function(){
      animate(sm, function(){
        cur.st = C.makeMove(st, sm); moveSound(sm, cur.st);
        view.st = cur.st; view.last = sm; render(); yourTurn();
      });
    }, 600);
  } else {
    cur.solver = st.turn;
    view.st = st; view.orient = cur.solver; view.last = null; render(); yourTurn();
  }
  var src = p.source === 'lichess'
    ? 'Puzzle from <a href="https://lichess.org/training/' + p.id + '" target="_blank" rel="noopener">Lichess</a>' + (p.rating ? ' · rating ' + p.rating : '')
    : 'Backup puzzle (couldn\'t reach Lichess)';
  $('src').innerHTML = src;
  if (p.id){ pz.seen.push(p.id); if (pz.seen.length > 400) pz.seen = pz.seen.slice(-400); save('pz', pz); }
  prefetch();
}
function puzzleBars(){
  var solverName = cur.solver === 'w' ? 'White' : 'Black', other = cur.solver === 'w' ? 'b' : 'w';
  bars({ html: pieceSVG(other === 'w' ? 'K' : 'k', 'av') + '<b>Computer</b>' },
       { html: pieceSVG(cur.solver === 'w' ? 'K' : 'k', 'av') + '<b>' + (pz.who ? esc(pz.who) : 'You') + ' (' + solverName + ')</b>', turn: !cur.done });
}
function goalText(){
  var p = cur.p, t = THEMES.filter(function(x){ return x.id === p.theme; })[0];
  if (p.source === 'backup' && p.mate) return 'Find checkmate in ' + p.mate + (p.mate > 1 ? ' moves!' : ' move!');
  if (p.themes && p.themes.indexOf('mateIn1') >= 0) return 'Find checkmate in 1 move!';
  if (p.themes && p.themes.indexOf('mateIn2') >= 0) return 'Find checkmate in 2 moves!';
  if (p.themes && p.themes.indexOf('mateIn3') >= 0) return 'Find checkmate in 3 moves!';
  return t ? t.goal : 'Find the best move!';
}
function yourTurn(){

  else say('Yes! Keep going…', 'What\'s next?');
}
function expected(){ return cur.p.solution[cur.ply] || null; }
function isMate(st){ return C.inCheck(st) && !C.legalMoves(st).length; }

function onPuzzleMove(m){
  if (cur.done) return;
  var after = C.makeMove(cur.st, m), u = C.uci(m), ok;
  if (cur.p.mate) ok = C.moveKeepsMate(cur.st, m, cur.mateLeft);
  else ok = u === expected() || isMate(after);
  view.hint = -1;
  if (!ok){
    cur.mistakes++; sfx.bad();
    view.st = after; view.last = m; view.flash = { sq: m.to, cls: 'bad' }; view.interactive = false; render();
    boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake');
    say(['Not quite. Try again!', 'Hmm, look again!', 'Close! Try another move.'][cur.mistakes % 3], cur.mistakes >= 2 ? 'Tap 💡 Hint if you\'re stuck.' : 'Look for checks, captures and threats.', true);
    resetStreak();
    setTimeout(function(){ view.st = cur.st; view.last = null; view.flash = null; view.interactive = true; render(); }, 800);
    return;
  }
  cur.st = after; cur.ply++; if (cur.p.mate) cur.mateLeft--;
  moveSound(m, after);
  view.st = after; view.last = m; view.flash = { sq: m.to, cls: 'good' }; view.interactive = false; render();
  var finished = isMate(after) || (!cur.p.mate && cur.ply >= cur.p.solution.length);
  if (finished) return solved();
  say('Great move! 👍', 'Now watch what the computer does…');
  setTimeout(opponentMove, 650);
}
function opponentMove(){
  var rm;
  if (cur.p.mate) rm = C.bestDefence(cur.st, cur.mateLeft);
  else rm = C.findUci(cur.st, expected());
  if (!rm) return solved();
  view.flash = null; render();
  animate(rm, function(){
    cur.st = C.makeMove(cur.st, rm); cur.ply++;
    moveSound(rm, cur.st);
    view.st = cur.st; view.last = rm; render();
    yourTurn();
  });
}
function solved(){
  cur.done = true; view.interactive = false; puzzleBars();
  var clean = !cur.mistakes && !cur.helped;
  var r = ps(); r.pz++;
  if (clean){ r.streak++; r.best = Math.max(r.best, r.streak); }
  saveStats(); chips();
  if (pz.who && roster.st[pz.who]) push({ t: 'puz', name: pz.who, clean: clean });
  var cheers = ['Brilliant! 🌟', 'You got it! 🎉', 'Amazing! 🏆', 'Super smart! 🧠', 'Chess star! ⭐'];
  say(cheers[Math.floor(Math.random() * cheers.length)], clean ? (r.streak > 1 ? r.streak + ' in a row!' : 'Solved with no mistakes.') : 'Solved! Try the next one with no hints.', true);
  sfx.win(); if (clean) confetti();
  $('next').classList.add('pulse');
}
$('next').onclick = function(){ sfx.click(); nextPuzzle(); };
$('hint').onclick = function(){
  if (!cur || cur.done || !view.interactive) return;
  var from = -1;
  if (cur.p.mate){
    var ms = C.legalMoves(cur.st);
    for (var i = 0; i < ms.length; i++) if (C.moveKeepsMate(cur.st, ms[i], cur.mateLeft)){ from = ms[i].from; break; }
  } else if (expected()) from = C.sqIndex(expected().slice(0, 2));
  if (from < 0) return;
  cur.helped = true; view.hint = from; clearSel(); render();
  say('Try moving this piece! 💡', 'It\'s glowing purple.');
  resetStreak();
};
$('show').onclick = function(){
  if (!cur || cur.done) return;
  cur.helped = true; view.interactive = false; view.hint = -1; clearSel();
  resetStreak();
  say('Here\'s how it goes 👀', 'Watch closely!');
  (function step(){
    if (isMate(cur.st) || (!cur.p.mate && cur.ply >= cur.p.solution.length)){
      cur.done = true; puzzleBars(); say('That\'s the answer!', 'Ready for the next one?'); $('next').classList.add('pulse'); return;
    }
    var m;
    if (cur.p.mate){
      if (cur.st.turn === cur.solver){
        var ms = C.legalMoves(cur.st);
        for (var i = 0; i < ms.length; i++) if (C.moveKeepsMate(cur.st, ms[i], cur.mateLeft)){ m = ms[i]; break; }
        cur.mateLeft--;
      } else m = C.bestDefence(cur.st, cur.mateLeft);
    } else m = C.findUci(cur.st, expected());
    if (!m){ cur.done = true; return; }
    render();
    animate(m, function(){
      cur.st = C.makeMove(cur.st, m); cur.ply++; moveSound(m, cur.st);
      view.st = cur.st; view.last = m; render();
      setTimeout(step, 700);
    });
  })();
};

/* ====================== MODES ====================== */
var mode = '';
function setMode(m){
  if (m === mode) return;
  mode = m; save('mode', m);
  $('tabPlay').classList.toggle('on', m === 'play'); $('tabPuz').classList.toggle('on', m === 'puzzle');
  $('playPanel').classList.toggle('hidden', m !== 'play'); $('puzPanel').classList.toggle('hidden', m !== 'puzzle');
  clearSel(); view.hint = -1; view.flash = null;
  if (m === 'play') showPlay(false);
  else { chips(); solverChips(); if (cur && !cur.done){ startPuzzleView(); } else nextPuzzle(); }
}
function startPuzzleView(){ // return to a puzzle in progress
  view.st = cur.st; view.orient = cur.solver; view.last = null; render(); yourTurn();
}
$('tabPlay').onclick = function(){ sfx.click(); setMode('play'); };
$('tabPuz').onclick = function(){ sfx.click(); setMode('puzzle'); };

/* theme picker */
function drawLooks(){
  $('looks').innerHTML = LOOKS.map(function(l){
    var keep = look; look = l;
    var mini = '<span style="background:' + l.light + '">' + pieceSVG('N', 'x') + '</span><span style="background:' + l.dark + '">' + pieceSVG('q', 'x') + '</span><span style="background:' + l.light + '">' + pieceSVG('p', 'x') + '</span>';
    look = keep;
    return '<button data-look="' + l.id + '" class="' + (l.id === look.id ? 'on' : '') + '"><span class="mini">' + mini + '</span>' + l.emoji + ' ' + l.name + '</button>';
  }).join('');
}
$('lookBtn').onclick = function(){ sfx.click(); drawLooks(); $('lookModal').classList.remove('hidden'); };
$('lookClose').onclick = function(){ $('lookModal').classList.add('hidden'); };
$('looks').onclick = function(e){
  var b = e.target.closest('[data-look]'); if (!b) return;
  applyLook(b.dataset.look); sfx.click(); drawLooks();
  render(); if (mode === 'play') showPlay(false); else if (cur) puzzleBars();
};
applyLook(load('look', 'classic'));

startSync();

var saved = load('game', null);
game = saved && saved.start ? { start: saved.start, ucis: saved.ucis || [], white: saved.white || '', black: saved.black || '', rec: saved.rec === undefined ? null : saved.rec } : { start: C.START, ucis: [], white: '', black: '', rec: null };
var startMode = location.hash === '#puzzles' ? 'puzzle' : load('mode', 'play');
rebuild();
if (startMode === 'play') { mode = ''; setMode('play'); } else { game.status = C.status(game.st, game.keys); setMode('puzzle'); }
})();
</script>
