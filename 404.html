<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Harsh Family</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0D1F">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(/assets/fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Figtree";src:url(/assets/fonts/figtree-600.woff2) format("woff2");font-weight:600;font-display:swap}
/* Missing page: the home page's night sky, one friendly line, and the three games one tap away. */
:root{--bg:#0B0D1F;--surface:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--ink:#F4F2FF;--muted:#A9A8C6;--coral:#FF5E5B;--marigold:#FFB627;--aqua:#2EC4B6;--violet:#8E5CF7;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;--body:"Figtree","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(60vmax 40vmax at 85% -10%,rgba(255,94,91,.22),transparent 70%),radial-gradient(50vmax 40vmax at -10% 30%,rgba(46,196,182,.16),transparent 70%);color:var(--ink);font-family:var(--body);font-weight:600;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:28px max(20px,env(safe-area-inset-left,0px)) 28px max(20px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:12px}
main{width:100%;max-width:640px;text-align:center;display:grid;gap:18px;justify-items:center}
.keys{display:flex;gap:10px}
.keys span{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;color:#14122B;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);animation:hop 2.4s ease-in-out infinite}
.keys span:nth-child(1){background:var(--coral)}
.keys span:nth-child(2){background:var(--marigold);animation-delay:.2s}
.keys span:nth-child(3){background:var(--aqua);animation-delay:.4s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,8vw,58px);line-height:1;letter-spacing:-.03em;margin:8px 0 0}
p{margin:0;color:var(--muted);font-size:19px;max-width:32ch}
.home{display:inline-block;margin-top:4px;padding:14px 26px;border-radius:999px;background:var(--marigold);color:#14122B;text-decoration:none;font-size:18px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;margin-top:10px}
.games a{display:grid;gap:6px;justify-items:center;padding:18px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.games a:hover{border-color:var(--c)}
.games i{font-style:normal;font-size:34px;line-height:1}
.games b{font-family:var(--display);font-weight:800;font-size:18px}
@media (max-width:420px){.keys span{width:54px;height:54px;font-size:26px}.games{gap:8px}.games a{padding:14px 6px}.games b{font-size:15px}}
@media (prefers-reduced-motion:reduce){.keys span{animation:none}}
</style>
</head>
<body>
<main>
  <div class="keys" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
  <h1>Oops, this page wandered off.</h1>
  <p>We looked everywhere. Let's go play something instead.</p>
  <a class="home" href="/">Back to the games</a>
  <nav class="games" aria-label="Games">
    <a href="https://play.nikhilharsh.com" style="--c:var(--coral)"><i aria-hidden="true">⌨️</i><b>Paws &amp; Keys</b></a>
    <a href="/draw/" style="--c:var(--aqua)"><i aria-hidden="true">🎨</i><b>Doodle</b></a>
    <a href="/chess/" style="--c:var(--violet)"><i aria-hidden="true">♞</i><b>Chess</b></a>
  </nav>
</main>
</body>
</html>
