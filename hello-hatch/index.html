<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Hatch</title>
<meta name="description" content="Hello Hatch: learn Spanish, Chinese and Hindi words, hatch a pet and help it grow.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Baloo 2 (SIL Open Font License, see /assets/fonts/baloo2-OFL.txt), stored on this site. Chinese uses the device's own Noto Sans CJK font. */
@font-face{font-family:'Baloo 2';font-style:normal;font-display:swap;font-weight:400 800;src:url(/assets/fonts/baloo2-devanagari.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+20F0,U+25CC,U+A830-A839,U+A8E0-A8FF,U+11B00-11B09}
@font-face{font-family:'Baloo 2';font-style:normal;font-display:swap;font-weight:400 800;src:url(/assets/fonts/baloo2-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Baloo 2';font-style:normal;font-display:swap;font-weight:400 800;src:url(/assets/fonts/baloo2-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* VOICE: warm, playful and encouraging, with big friendly targets for a 6 and an 8 year old
IDEA: a picture-book nest where every lesson helps an egg hatch and a pet grow up
PICTURE: the pet in its little scene, and a winding path of lesson stones
COLOUR and TYPE: warm paper ground, one bold accent per language (sunset orange, cinnabar, peacock teal); Baloo 2 with Noto Sans SC
LAYOUT: one column with tabs at the bottom on phones; on a Chromebook the path sits beside a pet panel */
:root{color-scheme:light dark;--bg:light-dark(#fff6e8,#1c1830);--card:light-dark(#fff,#2a2544);--ink:light-dark(#2b2340,#f6f1ff);--soft:light-dark(#6d6488,#b8b0d8);--line:light-dark(#eee2cf,#3d3760);--acc:#f47a20;--acc2:light-dark(#ffe3cc,#4a3020);--good:#1f9d55;--bad:#e5484d;--sun:#ffb800;--gold:#f5b700}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
[data-lang=zh]{--acc:#d93a3a;--acc2:light-dark(#ffdede,#4a2228)}
[data-lang=hi]{--acc:#0d9aa8;--acc2:light-dark(#d4f3f5,#173f45)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 'Baloo 2','Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
h1,h2,h3{line-height:1.08;margin:0;text-wrap:balance}
.hide{display:none!important}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:8px 18px;border:0;border-radius:18px;background:var(--acc);color:#fff;font-size:20px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn:disabled{background:var(--line);color:var(--soft);box-shadow:none;cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.good{background:var(--good)}.btn.bad{background:var(--bad)}
.btn.sm{min-height:44px;font-size:17px;border-radius:14px;width:auto}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px}
.muted{color:var(--soft)}
/* top bar */
.top{position:sticky;top:0;z-index:6;background:var(--bg);border-bottom:2px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:8px max(3vw,12px);flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:2px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:17px;white-space:nowrap}
.chip svg{width:24px;height:24px;flex:none}
.chip .mini{width:30px;height:30px}
.spacer{flex:1}
.gohome{text-decoration:none;color:inherit;font-size:20px}
.gohome b{font-size:17px}
@media(max-width:520px){.gohome b{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(3vw,12px)}
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:16px 0 110px}
.side{display:none}
@media(min-width:900px){.home{grid-template-columns:minmax(0,1fr) 340px;align-items:start}.side{display:grid;gap:16px;position:sticky;top:78px}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--line)}
.tabs div{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;width:100%;max-width:620px}
.tab{min-height:56px;border:0;border-radius:16px;background:transparent;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--soft);line-height:1.1}
.tab svg{width:26px;height:26px}
.tab.on{background:var(--acc2);color:var(--acc)}
/* language picker */
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lang{min-height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:18px;line-height:1.05;padding:4px}
.lang small{display:block;font-size:13px;color:var(--soft);font-weight:600}
.lang.on{border-color:var(--acc);background:var(--acc2)}
.lang[data-l=es].on{--acc:#f47a20}.lang[data-l=zh].on{--acc:#d93a3a}.lang[data-l=hi].on{--acc:#0d9aa8}
/* goal */
.goal{display:flex;gap:14px;align-items:center}
.goal .ring{flex:none;width:64px;height:64px}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--acc);transition:width .4s}
.bar.food i{background:#ff8a5c}.bar.grow i{background:#8a6cff}
/* path */
.unit{display:flex;gap:14px;align-items:center;background:var(--acc);color:#fff;border-radius:24px;padding:14px 18px;margin-top:22px}
.unit .ico{font-size:38px;line-height:1;flex:none}
.unit h2{font-size:26px}
.unit p{margin:0;opacity:.92;font-weight:600}
.nodes{display:flex;flex-direction:column;align-items:center;gap:30px;padding:26px 0 18px}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.node{width:84px;height:84px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;font-weight:800;box-shadow:0 7px 0 rgba(0,0,0,.24),inset 0 -6px 0 rgba(0,0,0,.12);position:relative;display:grid;place-items:center}
.node svg{width:38px;height:38px}
.node.locked{background:light-dark(#e7ddcd,#3b3558);color:var(--soft);box-shadow:0 7px 0 rgba(0,0,0,.1);cursor:not-allowed}
.node.open::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--acc);animation:pulse 1.6s infinite}
.node.done{background:var(--gold);color:#5a3d00}
.nlabel{font-weight:800;font-size:15px;color:var(--soft)}
.stars{display:flex;gap:2px}.stars svg{width:20px;height:20px}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.2);opacity:0}}
/* pet */
.scene{border-radius:24px;overflow:hidden;line-height:0;border:3px solid var(--line);background:#bfe6ff}
.scene svg{width:100%;height:auto;display:block}
.bob{animation:bob 2.4s ease-in-out infinite;transform-origin:100px 180px}
@keyframes bob{50%{transform:translateY(-4px) scale(1.02,.98)}}
.petname{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.petname h2{font-size:32px}
.bubble{position:relative;display:inline-block;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 14px;font-weight:800;font-size:20px;margin-bottom:8px}
.hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:20%;font-size:28px;animation:float 1.4s ease-out forwards}
@keyframes float{to{transform:translateY(-160px);opacity:0}}
.rowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.item{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px;border-radius:20px;border:3px solid var(--line);background:var(--card)}
.item.on{border-color:var(--acc);background:var(--acc2)}
.item .big{font-size:44px;line-height:1.1}
.item svg{width:96px;height:96px}
.item b{font-size:17px;line-height:1.1}
.price{display:inline-flex;align-items:center;gap:4px;font-weight:800}
.price svg{width:20px;height:20px}
.sec{margin:26px 0 10px;font-size:24px}
/* badges + league */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.badge{text-align:center;padding:12px;border-radius:20px;border:3px solid var(--line);background:var(--card)}
.badge svg{width:64px;height:64px}
.badge.off{opacity:.45;filter:grayscale(1)}
.badge b{display:block;line-height:1.1}.badge small{color:var(--soft);font-weight:600;line-height:1.2;display:block}
.league{display:grid;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.lrow .rk{font-weight:800;font-size:22px;width:28px;text-align:center}
.lrow svg{width:44px;height:44px;flex:none}
.lrow .xp{margin-left:auto;font-weight:800;white-space:nowrap}
/* players */
.hero{text-align:center;padding:28px 0 10px}
.logo{display:inline-flex;align-items:center;gap:10px;font-size:clamp(40px,8vw,60px);font-weight:800;color:#f47a20;line-height:1}
.logo svg{width:1.1em;height:1.1em}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;max-width:760px;margin:22px auto}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;border-radius:26px;border:3px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--line);font-weight:800;font-size:22px}
.pcard svg{width:120px;height:120px}
.pcard small{font-size:15px;color:var(--soft);font-weight:700}
.pcard.add{justify-content:center;border-style:dashed;color:var(--soft);min-height:200px}
.hold{position:relative;overflow:hidden}
.hold::before{content:"";position:absolute;inset:0;background:var(--acc2);transform:scaleX(0);transform-origin:left}
.hold.holding::before{transition:transform 1.5s linear;transform:scaleX(1)}
.hold span{position:relative;pointer-events:none}
/* forms */
.narrow{max-width:620px;margin:0 auto;padding:20px max(3vw,14px) 60px}
.field{width:100%;min-height:56px;font-size:22px;padding:8px 16px;border-radius:16px;border:3px solid var(--line);background:var(--card)}
.eggs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.eggbtn{border-radius:22px;border:3px solid var(--line);background:var(--card);padding:8px;font-weight:800}
.eggbtn svg{width:100%;height:auto}
.eggbtn.on{border-color:var(--acc);background:var(--acc2)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.cdot{width:48px;height:48px;border-radius:50%;border:4px solid transparent}
.cdot.on{border-color:var(--ink)}
.lbig{display:grid;gap:12px}
.lbig button{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;padding:8px 20px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-weight:800;font-size:22px}
.lbig button.on{border-color:var(--acc);background:var(--acc2)}
.lbig .say{font-size:26px}
/* lesson */
.lesson{max-width:700px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:10px 16px 0}
.lbar{display:flex;align-items:center;gap:12px;min-height:56px}
.x{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--soft)}
.x svg{width:28px;height:28px}
.prog{flex:1;height:20px;border-radius:10px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:10px;transition:width .35s}
.ex{flex:1;padding:10px 0 20px}
.prompt{font-size:clamp(22px,4vw,28px);font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:420px){.opts.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{min-height:110px;border-radius:22px;border:3px solid var(--line);background:var(--card);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px;font-weight:700;position:relative}
.opt.sel{border-color:var(--acc);background:var(--acc2);box-shadow:0 5px 0 var(--acc)}
.opt.good{border-color:var(--good);background:light-dark(#e2f7e9,#1d3b2b);box-shadow:0 5px 0 var(--good)}
.opt.bad{border-color:var(--bad);background:light-dark(#ffe6e3,#47252a);box-shadow:0 5px 0 var(--bad);animation:shake .35s}
.opt.gone{opacity:.25;pointer-events:none}
.opt .k{position:absolute;top:6px;left:10px;font-size:13px;color:var(--soft);font-weight:800}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pic{font-size:58px;line-height:1.05}
.sw{display:block;width:64px;height:64px;border-radius:50%;border:3px solid rgba(0,0,0,.18)}
.num{font-size:58px;line-height:1;font-weight:800;color:var(--acc)}
.word{font-size:28px;line-height:1.15;font-weight:700}
.word.zh{font-family:'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Baloo 2',sans-serif;font-size:32px;font-weight:700}
.rom{font-size:16px;line-height:1.2;color:var(--soft);font-weight:700}
.saybtn{display:inline-flex;flex-direction:column;align-items:center;gap:0;padding:6px 16px;border-radius:18px;border:3px solid var(--acc);background:var(--acc2);min-height:56px;justify-content:center}
.newtag{display:inline-block;background:var(--acc);color:#fff;font-weight:800;border-radius:999px;padding:2px 14px;font-size:16px}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:26px 16px}
.intro .bigpic .pic,.intro .bigpic .num{font-size:110px}
.intro .bigpic .sw{width:120px;height:120px}
.intro .rom{display:block}.intro .word{font-size:44px}.intro .word.zh{font-size:54px}.intro .rom{font-size:22px}
.en{font-size:22px;font-weight:700;color:var(--soft)}
.spkrow{display:flex;gap:12px;justify-content:center;margin:6px 0}
.spk{width:64px;height:64px;border-radius:20px;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.spk svg{width:34px;height:34px}
.spk.slow{background:var(--card);color:var(--acc);border:3px solid var(--acc)}
.spk.huge{width:130px;height:130px;border-radius:34px}.spk.huge svg{width:70px;height:70px}
.showpic{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 0 16px}
.showpic .pic,.showpic .num{font-size:96px}.showpic .sw{width:104px;height:104px}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.match .col{display:grid;gap:10px}
.match .opt{min-height:72px}
.match .opt .pic,.match .opt .num{font-size:44px}.match .opt .sw{width:48px;height:48px}
.target{font-size:22px;font-weight:800;margin-bottom:4px}
.hint{font-weight:600;color:var(--soft);margin:0 0 10px}
.ansline{min-height:76px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;margin:8px 0 18px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-height:58px;padding:4px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:22px;font-weight:700;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tile .t.zh{font-family:'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Baloo 2',sans-serif;font-size:26px}
.tile .r{font-size:14px;color:var(--soft)}
.tile.used{visibility:hidden}
.foot{position:sticky;bottom:0;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
.fb{border-radius:20px;padding:12px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.fb svg.mini{width:64px;height:64px;flex:none}
.fb b{font-size:22px;display:block;line-height:1.1}
.fb.ok{background:light-dark(#dcf6e4,#1d3b2b);color:light-dark(#11663a,#a4f0c3)}
.fb.no{background:light-dark(#ffe4de,#47252a);color:light-dark(#a3261f,#ffb7ae)}
.fb .ans{font-weight:700}
.voicewarn{font-size:15px;font-weight:600;color:var(--soft);margin-top:6px}
/* end */
.end{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px;text-align:center}
.end h1{font-size:clamp(34px,7vw,48px);color:var(--acc)}
.bigstars{display:flex;justify-content:center;gap:10px}.bigstars svg{width:64px;height:64px}
.gain{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gain div{padding:10px 6px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:22px;line-height:1.1}
.gain small{display:block;font-size:14px;color:var(--soft)}
.hatchwrap{position:relative;max-width:300px;margin:0 auto;width:100%}
.hatchwrap .egglayer{position:absolute;inset:0;animation:eggout 1.8s forwards}
.hatchwrap .petlayer{animation:petin 1.8s forwards}
@keyframes eggout{0%,55%{opacity:1;transform:rotate(0)}10%,30%{transform:rotate(-6deg)}20%,40%{transform:rotate(6deg)}70%,100%{opacity:0;transform:scale(1.2)}}
@keyframes petin{0%,55%{opacity:0;transform:scale(.6)}80%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
/* dialogs, toast */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(20,14,40,.5);display:grid;place-items:center;padding:16px}
.dlg{max-width:420px;width:100%;display:grid;gap:14px;text-align:center}
.dlg h2{font-size:26px}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:21;background:var(--ink);color:var(--bg);font-weight:700;padding:10px 18px;border-radius:16px;max-width:90vw;text-align:center}
/* grown-ups */
.set{display:grid;gap:12px;margin-bottom:22px}
.setrow{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:18px;background:var(--card);border:2px solid var(--line)}
.setrow > div{flex:1 1 220px}
.tog{min-width:84px;min-height:44px;border-radius:999px;border:3px solid var(--line);background:var(--card);font-weight:800}
.tog[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#fff}
select.field{font-size:18px;min-height:44px;width:auto}
textarea.field{min-height:110px;font-size:14px;font-family:ui-monospace,monospace}
/* quests, stories, practice */
.quest{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.quest > svg{width:48px;height:48px;flex:none}
.quest .qb{flex:1}
.quest b{font-size:19px;line-height:1.15;display:block}
.quest .muted{font-size:15px}
.quest.claimed{opacity:.6}
.team{background:var(--acc2);border-color:var(--acc)}
.teamrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.teamrow span{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:15px}
.teamrow svg{width:30px;height:30px}
.frz{display:inline-flex;align-items:center;gap:2px;margin-left:4px;color:#2f8fd6}
.chip .frz svg{width:18px;height:18px}
.storybtn{display:flex;align-items:center;gap:12px;width:100%;max-width:420px;margin:0 auto 8px;min-height:60px;padding:8px 16px;border-radius:20px;border:3px solid var(--acc);background:var(--card);font-weight:800;font-size:18px;text-align:left}
.storybtn svg{width:36px;height:36px;flex:none;color:var(--acc)}
.storybtn.locked{border-color:var(--line);color:var(--soft);cursor:not-allowed}
.storybtn small{display:block;font-weight:600;color:var(--soft);font-size:14px}
.practice{display:flex;align-items:center;gap:14px;margin-top:12px}
.practice svg.ic{width:48px;height:48px;flex:none;color:var(--acc)}
.story{max-width:700px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:10px 16px 0}
.slog{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 0 20px}
.sline{display:flex;gap:10px;align-items:flex-end}
.sline.r{flex-direction:row-reverse}
.sline > svg{width:64px;height:64px;flex:none}
.sb{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px 14px;max-width:80%;text-align:left}
.sline.now .sb{border-color:var(--acc)}
.sb .who{font-size:14px;font-weight:800;color:var(--soft)}
.sb .st{font-size:26px;font-weight:700;line-height:1.2;display:block}
.sb .st.zh{font-family:'Noto Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Baloo 2',sans-serif}
.sb .sr{font-size:16px;color:var(--soft);font-weight:700;display:block}
.sb .se{font-size:17px;font-weight:600;color:var(--good);display:block;margin-top:2px}
.sb .tools{display:flex;gap:8px;margin-top:6px}
.sb .tools button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:0 12px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px}
.sb .tools svg{width:20px;height:20px}
.sq{border:3px solid var(--acc);border-radius:22px;padding:14px;background:var(--acc2)}
.sq .opts{grid-template-columns:minmax(0,1fr)}
.sq .opt{min-height:56px;font-size:20px}

/* ---------- state ---------- */
const view = {screen: S.players.length ? 'players' : 'players', tab:'learn', np:null, modal:null, toast:'', fx:''};
let LS = null;   // lesson state

function toast(t){ view.toast=t; render(); clearTimeout(toastT); toastT=setTimeout(()=>{view.toast='';render()},2200); }

/* ---------- lessons ---------- */
function mkOpts(w,pool,n){
  const others = shuffle(pool.filter(x=>x.t!==w.t && x.pic!==w.pic)).slice(0,n-1);
  return shuffle([w,...others]);
}
function buildLesson(lang,u,n){
  const L = LANGS[lang], unit = L.units[u], W = unit.words, nopt = P().easy?3:4;
  const half = Math.ceil(W.length/2);
  const poolOf = w=>L.units[w.u].words;
  const mk = (type,w)=>({type,w,opts:mkOpts(w,poolOf(w),nopt)});
  const ex = [];
  if (n<2) {
    const set = n===0 ? W.slice(0,half) : W.slice(half);
    set.forEach(w=>{ ex.push({type:'intro',w}); ex.push(mk('pickPic',w)); });
    ex.push({type:'match',pairs:set.slice(0,5)});
    sample(set,Math.min(3,set.length)).forEach(w=>ex.push(mk('pickWord',w)));
    sample(set,2).forEach(w=>ex.push(mk('listen',w)));
  } else if (n===2) {
    const s = shuffle(W);
    ex.push({type:'match',pairs:sample(W,4)});
    s.slice(0,3).forEach(w=>ex.push(mk('listen',w)));
    ex.push({type:'build',s:unit.sent[0]});
    s.slice(3,6).forEach(w=>ex.push(mk('pickWord',w)));
    ex.push({type:'build',s:unit.sent[1]});
    sample(W,2).forEach(w=>ex.push(mk('pickPic',w)));
  } else {
    const prev = L.units.slice(0,u).flatMap(x=>x.words);
    const pool = shuffle([...sample(W,5), ...sample(prev,3)]);
    const types = ['pickPic','pickWord','listen'];
    pool.forEach((w,i)=>ex.push(mk(types[i%3],w)));
    ex.splice(3,0,{type:'match',pairs:sample(W,4)});
    ex.splice(5,0,{type:'build',s:unit.sent[0]});
    ex.splice(8,0,{type:'build',s:unit.sent[1]});
    if (u>0) ex.push({type:'build',s:pick(L.units[u-1].sent)});
  }
  return ex;
}
function startLesson(u,n){
  const p = P(), lang = p.lang;
  LS = {lang,u,n,ex:buildLesson(lang,u,n),i:0,mist:0,phase:'answer',sel:null,ok:null};
  prepEx();
  view.screen='lesson'; render(); autoSpeak();
}
function prepEx(){
  const e = LS.ex[LS.i]; if (!e) return;
  LS.sel=null; LS.phase='answer'; LS.ok=null;
  if (e.type==='match') { LS.m = {left:shuffle(e.pairs),right:shuffle(e.pairs),pick:null,done:[],bad:null}; }
  if (e.type==='build') {
    const L = LANGS[LS.lang], toks = e.s.k;
    const texts = toks.map(t=>t.t.toLowerCase());
    const extra = sample(L.units[LS.u].words.filter(w=>{const lw=w.t.toLowerCase();return !texts.includes(lw) && !texts.some(t=>lw.includes(t)||t.includes(lw))}),2).map(w=>({t:w.t.replace(/^(el|la) /,''),r:w.r}));
    LS.b = {bank:shuffle([...toks,...extra.filter(x=>!texts.includes(x.t.toLowerCase()))]),ans:[]};
  }
}
function autoSpeak(){
  const e = LS && LS.ex[LS.i]; if (!e || view.screen!=='lesson') return;
  const lang = LS.lang;
  if (['intro','pickPic','listen'].includes(e.type)) setTimeout(()=>{ if (view.screen==='lesson') speak(e.w.t,lang); },250);
}
const sentText = (s,lang)=>s.k.map(t=>t.t).join(LANGS[lang].join);
function check(){
  const e = LS.ex[LS.i];
  let ok;
  if (e.type==='build') ok = LS.b.ans.map(i=>LS.b.bank[i].t).join('\u0001')===e.s.k.map(t=>t.t).join('\u0001');
  else ok = LS.sel!==null && e.opts[LS.sel].t===e.w.t;
  LS.ok=ok; LS.phase='feedback';
  const pl = P();
  if (ok) qAdd(pl,'right');
  if (e.w) { LS.wm = LS.wm || {}; if (!ok) LS.wm[e.w.t] = 1; if (!ok) missAdd(pl,LS.lang,e.w.t,2); else if (LS.practice) missAdd(pl,LS.lang,e.w.t,-2); else if (!LS.wm[e.w.t]) missAdd(pl,LS.lang,e.w.t,-1); }
  if (ok) sGood(); else {
    sBad(); LS.mist++;
    if (!e.re) LS.ex.push({...e,re:true,opts:e.opts?shuffle(e.opts):undefined});
  }
  render();
  const lang = LS.lang;
  setTimeout(()=>{ if (e.type==='build') speak(sentText(e.s,lang),lang); else speak(e.w.t,lang); },ok?350:500);
}
function next(){
  LS.i++;
  if (LS.i>=LS.ex.length) return finish();
  prepEx(); render(); autoSpeak();
  const f=document.querySelector('.ex'); if (f) window.scrollTo(0,0);
}
function award(p,{xp,coins,lang,kind,stars}){
  const t = today();
  tick(p);
  const hatch = !p.hatched && kind==='lesson';
  const goalBefore = p.day.xp, teamBefore = teamGoal();
  const qBefore = p.q.list.filter(id=>questDone(p,id));
  const stBefore = stageOf(p);
  p.xp += xp; p.coins += coins; p.day.xp += xp; p.week.xp += xp;
  p.food = Math.min(100,p.food+(kind==='story'?10:15));
  qAdd(p,'xp',xp);
  if (kind==='lesson' || kind==='practice') { p.lessons++; qAdd(p,'lessons'); }
  if (kind==='practice') qAdd(p,'practice');
  if (kind==='story') qAdd(p,'story');
  if (stars===3) { p.perfect++; qAdd(p,'perfect'); }
  if (!p.tried.includes(lang)) p.tried.push(lang);
  if (kind==='lesson') p.hatched = true;
  let streakUp=false;
  if (p.lastDay!==t) { p.streak = p.lastDay && dayDiff(p.lastDay,t)===1 ? p.streak+1 : 1; p.lastDay=t; streakUp=true; }
  const fresh = BADGES.filter(b=>!p.badges.includes(b.id) && b.t(p));
  fresh.forEach(b=>p.badges.push(b.id));
  const grew = !hatch && stBefore>=0 && stageOf(p)>stBefore;
  const quests = p.q.list.filter(id=>questDone(p,id) && !qBefore.includes(id)).map(id=>questDef(id).t);
  const tg = teamGoal();
  return {stars,xp,coins,hatch,streakUp,fresh,grew,kind,quests,teamHit:teamBefore.have<teamBefore.need && tg.have>=tg.need,goalHit:goalBefore<p.goal && p.day.xp>=p.goal};
}
function finish(){
  const p = P(), {lang,u,n,mist} = LS;
  const stars = mist===0?3:mist<=2?2:1;
  if (LS.practice) {
    R = award(p,{xp:10+(stars===3?5:0),coins:5+stars,lang,kind:'practice',stars});
  } else {
    const id = u+'-'+n;
    p.prog[lang][id] = Math.max(p.prog[lang][id]||0, stars);
    R = award(p,{xp:(n===3?15:10)+(stars===3?5:0),coins:4+stars*2,lang,kind:'lesson',stars});
  }
  save(); sWin();
  view.screen='end'; render();
  if (R.hatch) setTimeout(()=>speak(LANGS[lang].hello,lang),1700);
}
function startPractice(){
  const p = P(), lang = p.lang, L = LANGS[lang];
  const missed = Object.entries(p.miss[lang]).sort((a,b)=>b[1]-a[1]).map(([t])=>wordByT(lang,t)).filter(Boolean).slice(0,6);
  const learned = L.units.filter((_,u)=>p.prog[lang][u+'-0']).flatMap((u,i)=>{const unit=L.units.indexOf(u); return u.words.filter((w,j)=>p.prog[lang][unit+'-1'] || j<Math.ceil(u.words.length/2));});
  const words = missed.slice();
  for (const w of shuffle(learned)) { if (words.length>=6) break; if (!words.includes(w)) words.push(w); }
  if (words.length<3) { toast('Finish a lesson first, then practice here'); return; }
  const nopt = p.easy?3:4, types=['pickPic','pickWord','listen'];
  const ex = shuffle(words).map((w,i)=>({type:types[i%3],w,opts:mkOpts(w,L.units[w.u].words,nopt)}));
  ex.splice(2,0,{type:'match',pairs:words.slice(0,4)});
  words.slice(0,2).forEach(w=>ex.push({type:'listen',w,opts:mkOpts(w,L.units[w.u].words,nopt)}));
  LS = {lang,u:-1,n:-1,practice:true,ex,i:0,mist:0,phase:'answer',sel:null,ok:null};
  prepEx(); view.screen='lesson'; render(); autoSpeak();
}
/* ---------- stories ---------- */
let ST = null;
function startStory(u){
  const p = P(), lang = p.lang, story = STORIES[lang][u];
  const items = [];
  story.lines.forEach((l,i)=>{ items.push({k:'line',i}); story.qs.forEach((q,qi)=>{ if (q.after===i) items.push({k:'q',qi}); }); });
  ST = {lang,u,story,items,pos:0,en:{},opts:story.qs.map(q=>shuffle(q.o.map((t,i)=>({t,ok:i===0})))),done:{},bad:null};
  view.screen='story'; render(); storySpeak();
}
function storySpeak(){
  const it = ST && ST.items[ST.pos]; if (!it || it.k!=='line') return;
  const lang = ST.lang, text = ST.story.lines[it.i][1];
  setTimeout(()=>{ if (view.screen==='story') speak(text,lang); },250);
}
function storyFinish(){
  const p = P(), {lang,u} = ST;
  const first = !p.stories[lang][u];
  p.stories[lang][u] = 1;
  R = award(p,{xp:first?15:8,coins:first?8:3,lang,kind:'story',stars:0});
  R.title = STORY_TITLES[u];
  LS = {lang};
  save(); sWin(); view.screen='end'; render();
}

function exBody(e){
  const lang = LS.lang, L = LANGS[lang], fb = LS.phase==='feedback';
  const optState = i=>{
    if (!fb) return LS.sel===i?' sel':'';
    if (e.opts[i].t===e.w.t) return ' good';
    return LS.sel===i?' bad':' gone';
  };
  const spk = (text)=>`<div class="spkrow"><button class="spk${e.type==='listen'?' huge':''}" data-act="say" data-text="${esc(text)}" aria-label="Play">${IC.spk}</button><button class="spk slow" data-act="say" data-slow="1" data-text="${esc(text)}" aria-label="Play slowly">${IC.snail}</button></div>`;
  const grid = (inner)=>`<div class="opts${e.opts.length===3?' three':''}">${inner}</div>`;
  if (e.type==='intro') return `<span class="newtag">New word</span><div class="card intro"><div class="bigpic">${picHTML(e.w.pic)}</div><div>${wordHTML(e.w,lang)}</div><div class="en">${esc(e.w.en)}</div>${spk(e.w.t)}</div>`;
  if (e.type==='pickPic') return `<div class="prompt">Which picture is <button class="saybtn" data-act="say" data-text="${esc(e.w.t)}">${wordHTML(e.w,lang)}</button></div>${grid(e.opts.map((o,i)=>`<button class="opt${optState(i)}" data-act="sel" data-i="${i}" aria-label="${esc(o.en)}"><span class="k">${i+1}</span>${picHTML(o.pic)}</button>`).join(''))}`;
  if (e.type==='pickWord') return `<div class="prompt">How do you say this in ${L.name}?</div><div class="showpic">${picHTML(e.w.pic)}<span class="en">${esc(e.w.en)}</span></div>${grid(e.opts.map((o,i)=>`<button class="opt${optState(i)}" data-act="sel" data-i="${i}" data-speak="1"><span class="k">${i+1}</span>${wordHTML(o,lang)}</button>`).join(''))}`;
  if (e.type==='listen') {
    const easy = P().easy;
    return `<div class="prompt">Listen and pick</div>${spk(e.w.t)}<div style="height:14px"></div>${grid(e.opts.map((o,i)=>`<button class="opt${optState(i)}" data-act="sel" data-i="${i}"><span class="k">${i+1}</span>${easy?picHTML(o.pic):wordHTML(o,lang)}</button>`).join(''))}`;
  }
  if (e.type==='match') {
    const m = LS.m;
    const cell = (side,w,i)=>{
      const done = m.done.includes(w.t), picked = m.pick && m.pick[0]===side && m.pick[1]===i;
      const bad = m.bad && ((m.bad[0]===side&&m.bad[1]===i)||(m.bad[2]===side&&m.bad[3]===i));
      return `<button class="opt${done?' good gone':picked?' sel':bad?' bad':''}" data-act="match" data-side="${side}" data-i="${i}" ${done?'disabled':''} ${side==='R'?`aria-label="${esc(w.en)}"`:''}>${side==='L'?wordHTML(w,lang):picHTML(w.pic)}</button>`;
    };
    return `<div class="prompt">Tap the pairs</div><div class="match"><div class="col">${m.left.map((w,i)=>cell('L',w,i)).join('')}</div><div class="col">${m.right.map((w,i)=>cell('R',w,i)).join('')}</div></div>`;
  }
  if (e.type==='build') {

function lessonScreen(){

  else if (e.type==='match') foot = LS.m.done.length===e.pairs.length ? `<div class="fb ok">${p.hatched?petSVG(p,{scene:false,mood:'happy'}).replace('<svg','<svg class="mini"'):''}<div><b>All matched!</b></div></div><button class="btn good" data-act="next">Continue</button>` : `<button class="btn" disabled>Match them all</button>`;

    <div class="ex">${exBody(e)}${noVoice}</div><div class="foot">${foot}</div></div>`;
}
function storyScreen(){

function render(){

    let data; try { data=JSON.parse(v); } catch(e) { toast('That doesn’t look like a backup'); return; }
    if (!data || !Array.isArray(data.players)) { toast('That doesn’t look like a backup'); return; }
    view.modal={title:'Replace saves on this computer?',text:'Players here will be replaced by the '+data.players.length+' in the backup.',yes:'Replace',danger:true,go:()=>{ const now=Date.now(); for (const p of S.players) if (!data.players.some(x=>x&&x.id===p.id)) S.deleted[p.id]=now; const keep=S.deleted; S=fixSave(data); S.deleted=Object.assign({},S.deleted,keep); for (const p of S.players) { p.ts=now; FP[p.id]=fpOf(p); delete S.deleted[p.id]; } S.cur=''; save(); view.screen='players'; }}; render();
  },
  modalNo(){ view.modal=null; render(); },
  modalYes(){ const g=view.modal&&view.modal.go; view.modal=null; if (g) g(); render(); }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = A[el.dataset.act];
  if (f) f(el.dataset, el, e);
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-act-change]'); if (!el) return;
  if (el.dataset.actChange==='rate') { S.set.rate=+el.value; save(); speak(LANGS[(P()||{lang:'es'}).lang].hello,(P()||{lang:'es'}).lang); }
  if (el.dataset.actChange==='goal') { const p=S.players.find(x=>x.id===el.dataset.id); if(p){p.goal=+el.value; save();} }
});
document.addEventListener('keydown', e=>{
  if (!view.modal && view.screen==='story' && ST && e.key==='Enter' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) { e.preventDefault(); A.storyNext(); return; }
  if (view.modal || view.screen!=='lesson' || !LS) { if (e.key==='Enter' && view.screen==='new' && e.target.id==='npName') A.npNext(); return; }
  const ex = LS.ex[LS.i];
  if (/^[1-4]$/.test(e.key) && ex.opts && LS.phase==='answer' && +e.key<=ex.opts.length) { A.sel({i:+e.key-1, speak:ex.type==='pickWord'?'1':''}); }
  if (e.key==='Enter') {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    e.preventDefault();
    const btn = document.querySelector('.foot .btn:not([disabled])'); if (btn) btn.click();
  }
});
// press and hold for grown-ups
let holdT;
document.addEventListener('pointerdown', e=>{
  const el = e.target.closest('[data-hold]'); if (!el) return;
  el.classList.add('holding');
  holdT = setTimeout(()=>{ el.classList.remove('holding'); view.screen='grown'; render(); window.scrollTo(0,0); },1500);
});
const holdEnd = ()=>{ clearTimeout(holdT); document.querySelectorAll('.holding').forEach(x=>x.classList.remove('holding')); };
['pointerup','pointerleave','pointercancel'].forEach(t=>document.addEventListener(t, e=>{ if (t!=='pointerleave' || (e.target.matches && e.target.matches('[data-hold]'))) holdEnd(); }, true));
document.addEventListener('contextmenu', e=>{ if (e.target.closest('[data-hold]')) e.preventDefault(); });

render();
if (SYNC) { syncNow(); document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') syncNow(); }); setInterval(()=>{ if (document.visibilityState==='visible') syncNow(); }, 60000); }
}
</script>
</body>
